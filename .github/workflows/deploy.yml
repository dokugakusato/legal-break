# ゲームを Firebase Hosting（https://legal-break.5ukaku.com）に自動で載せる
# 必要なもの：リポジトリの Secrets に FIREBASE_SERVICE_ACCOUNT（Firebaseのサービスアカウントの鍵）
name: 公開（5ukaku.com）
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['声を録音']
    types: [completed]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 鍵があるか確かめる
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: if [ -n "$SA" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "鍵（FIREBASE_SERVICE_ACCOUNT）がまだ無いので公開をとばします"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == '1'
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == '1'
        with:
          node-version: 22
      - name: Firebase Hosting に公開
        if: steps.key.outputs.ok == '1'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx -y firebase-tools@latest deploy --only hosting --project legal-break-6882d --non-interactive > "$RUNNER_TEMP/out.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/out.txt"
          rm -f "$RUNNER_TEMP/sa.json"
          if [ $code -ne 0 ]; then grep -v '^\s*$' "$RUNNER_TEMP/out.txt" | tail -12 | while IFS= read -r l; do echo "::error::$l"; done; exit $code; fi
      - name: 記録の保存ルール（firestore.rules）も載せる（できなかったら、Firebaseの画面で貼り付ける）
        if: steps.key.outputs.ok == '1'
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx -y firebase-tools@latest deploy --only firestore:rules --project legal-break-6882d --non-interactive
          code=$?
          rm -f "$RUNNER_TEMP/sa.json"
          if [ $code -ne 0 ]; then echo "::warning::記録の保存ルールは載せられなかった。Firebaseの画面（Firestore → ルール）に firestore.rules の中身を貼り付けて公開してください。"; fi
          exit $code
