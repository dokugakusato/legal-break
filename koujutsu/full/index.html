<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>海事代理士 口述トレーナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 試験室の答案用紙：紺の罫と真鍮色の目印。上部に科目と残り時間、中央に設問カード */
:root{
  --bg:#EEF1F2; --paper:#FFFFFF; --ink:#14232F; --muted:#5B6B77; --line:#D3DBE0;
  --navy:#1D4466; --navy-ink:#FFFFFF; --brass:#9C7A2E; --ok:#1E7A4F; --ng:#B3362F; --part:#A86B12;
  --ok-bg:#E3F2EA; --ng-bg:#F8E5E3; --part-bg:#FBF0DC; --soft:#E4EAEE;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E161D; --paper:#16222C; --ink:#E6ECEF; --muted:#94A3AE; --line:#2A3A46;
  --navy:#5B8DB8; --navy-ink:#0E161D; --brass:#CDAA5C; --ok:#5CC08E; --ng:#E77B72; --part:#E0A84E;
  --ok-bg:#16301F; --ng-bg:#36201E; --part-bg:#33281A; --soft:#1E2C37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161D; --paper:#16222C; --ink:#E6ECEF; --muted:#94A3AE; --line:#2A3A46;
  --navy:#5B8DB8; --navy-ink:#0E161D; --brass:#CDAA5C; --ok:#5CC08E; --ng:#E77B72; --part:#E0A84E;
  --ok-bg:#16301F; --ng-bg:#36201E; --part-bg:#33281A; --soft:#1E2C37; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.model{font-size:1.05rem;line-height:1.85;white-space:pre-line;margin:4px 0 0;font-weight:500}
.ansbox{background:var(--paper);border:1px solid var(--brass);border-radius:10px;padding:16px}
.ansbox .lbl{font-size:.75rem;letter-spacing:.12em;color:var(--brass);font-weight:700}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.25rem;font-weight:800}
.eyebrow{font-size:.75rem;letter-spacing:.14em;color:var(--brass);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.tabs button{border:0;background:transparent;color:var(--muted);padding:12px;font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--navy);color:var(--navy-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set label{font-weight:500}
.set .sub{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-width:55vw}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:.2s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--paper);transition:.2s;box-shadow:0 1px 2px #0003}
.sw input:checked+span{background:var(--navy)}
.sw input:checked+span::after{transform:translateX(22px)}
.sw input:focus-visible+span{outline:2px solid var(--brass);outline-offset:2px}
.btn{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:var(--navy-ink);padding:12px 18px;cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.wide{width:100%}
.btn.big{font-size:1.1rem;padding:16px}
.btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.yr{font-size:.72rem;letter-spacing:.06em;color:var(--brass);font-weight:700}
/* exam */
.examhead{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.clock{font-family:var(--f-disp);font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.clock.low{color:var(--ng)}
.watch{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.watch .t{font-family:var(--f-disp);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.watch .t small{font-size:1rem;color:var(--muted);font-weight:600;margin-left:6px}
.watch .t.low{color:var(--ng)}
.watch .bar{grid-column:1/-1}
.watch .hid{font-weight:700;color:var(--muted)}
.tgl{font:inherit;font-weight:700;font-size:.85rem;border:1px solid var(--navy);color:var(--navy);background:transparent;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px;white-space:nowrap}
.tgl[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.micdot{width:18px;height:18px;border-radius:50%;background:var(--line);flex:none}
.micdot.on{background:var(--ng);box-shadow:0 0 0 0 var(--ng);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ng) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.microw{display:flex;gap:12px;align-items:center}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--navy);transition:width .5s linear}
.steps{display:flex;gap:6px}
.steps b{width:26px;height:8px;border-radius:2px;background:var(--soft)}
.steps b.done{background:var(--navy)}.steps b.pass{background:var(--brass)}.steps b.cur{background:var(--ink)}
.qcard{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:10px;padding:20px 18px;min-height:150px}
.qtext{font-family:var(--f-disp);font-size:1.2rem;font-weight:600;line-height:1.75}
.qtext.hidden-q{color:transparent;text-shadow:0 0 12px var(--muted);user-select:none}
.mic{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.status{font-weight:700}
.heard{min-height:2.6em;padding:10px 12px;border-radius:8px;background:var(--soft);font-size:1rem;word-break:break-all}
.heard .interim{color:var(--muted)}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fallback{display:flex;gap:8px}
.fallback input{flex:1;min-width:0;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.verdict{border-radius:10px;padding:16px;border:1px solid var(--line)}
.verdict.ok{background:var(--ok-bg);border-color:var(--ok)}
.verdict.ng{background:var(--ng-bg);border-color:var(--ng)}
.verdict.part{background:var(--part-bg);border-color:var(--part)}
.vt{font-family:var(--f-disp);font-size:1.35rem;font-weight:800}
.ok .vt{color:var(--ok)}.ng .vt{color:var(--ng)}.part .vt{color:var(--part)}
.ans{white-space:pre-line;margin:6px 0 0}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.key{font-size:.78rem;padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.key.hit{border-color:var(--ok);color:var(--ok);font-weight:700}
.res{display:flex;flex-direction:column;gap:10px}
.ritem{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:12px;background:var(--paper)}
.ritem.ok{border-left-color:var(--ok)}.ritem.ng{border-left-color:var(--ng)}.ritem.part{border-left-color:var(--part)}.ritem.skip{border-left-color:var(--brass)}
.ritem .q{font-weight:700}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:4px;margin-right:6px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.ng{background:var(--ng-bg);color:var(--ng)}.tag.part{background:var(--part-bg);color:var(--part)}.tag.skip{background:var(--soft);color:var(--brass)}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.score div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.score b{display:block;font-family:var(--f-disp);font-size:1.4rem;font-variant-numeric:tabular-nums}
.score span{font-size:.72rem;color:var(--muted)}
details summary{cursor:pointer;color:var(--navy);font-weight:700}
/* 肢別 */
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox button{font-family:var(--f-disp);font-size:2.4rem;font-weight:800;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.ox button.o:hover,.ox button.o.sel{border-color:var(--ok);color:var(--ok)}
.ox button.x:hover,.ox button.x.sel{border-color:var(--ng);color:var(--ng)}
.ox button:disabled{cursor:default}
.stmt{font-size:1.1rem;line-height:1.85;font-weight:500}
.prog{font-variant-numeric:tabular-nums}
@media (max-width:400px){.score{grid-template-columns:repeat(2,1fr)}.qtext{font-size:1.1rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
"use strict";
// ───── 共通 ─────
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ycount=it=>it.y.split(",").length;
const ylabel=it=>it.y.split(",").map(x=>x==="元"?"R元":"R"+x).join("・");
const EDITION="full"; // trial（お試し版）/ full（完全版）/ dev
const NOTE_URL="https://note.com/fiola/n/nd2ac5bf87f37";   // 完全版を買うnote記事
function initBank(){BANK.forEach((it,i)=>{it.id=i;it.n=it.n||it.k.length})}
const store={get(k,d){try{const v=localStorage.getItem("kaiji_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("kaiji_"+k,JSON.stringify(v))}catch(e){}}};
const S=Object.assign({mode:"oral",judge:true,showText:true,weighted:true,subjects:[0,1,2,3],voice:"",
  oxJudge:true,oxSubject:0,oxOrder:"imp",oxCount:20},store.get("settings",{}));
const save=()=>store.set("settings",S);

// 文字の正規化（全角半角・カナ・漢数字・か月表記をそろえる）
function kanjiNum(s){
  const D={"〇":0,"零":0,"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
  const U={"十":10,"百":100,"千":1000};
  return s.replace(/[0-9〇零一二三四五六七八九十百千]+/g,m=>{
    if(/^[0-9]+$/.test(m))return m;
    let total=0,cur=0,any=false;
    for(const c of m){
      if(c>="0"&&c<="9"){cur=cur*10+(+c);any=true}
      else if(c in D){cur=cur*10+D[c];any=true}
      else{total+=(cur||1)*U[c];cur=0;any=true}
    }
    return any?String(total+cur):m;
  });
}
function norm(s){
  s=String(s).normalize("NFKC").toLowerCase();
  s=s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  s=s.replace(/[\s、。，．・,.「」『』（）()！？!?\-ー～〜:：;；]/g,"");
  s=kanjiNum(s);
  s=s.replace(/箇月|ヶ月|ヵ月|ゖ月|ゕ月|か月|け月|カ月/g,"か月").replace(/([0-9])月/g,"$1か月");
  return s;
}
function grade(it,text){
  const t=norm(text);
  const hits=it.k.map(g=>g.split("|").some(w=>{const n=norm(w);return n&&t.includes(n)}));
  const c=hits.filter(Boolean).length;
  const r=c>=it.n?"ok":c>0?"part":"ng";
  return {r,hits};
}
const VERD={ok:"言えた",part:"一部言えた",ng:"言えなかった",skip:"パス・時間切れ",none:"無回答"};

// ───── 音声合成（男性・普通の速さ） ─────
let voices=[];
function loadVoices(){voices=(speechSynthesis.getVoices()||[]).filter(v=>/^ja/i.test(v.lang))}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(view==="home")renderHome()}}
const MALE=/otoya|ichiro|keita|hattori|daichi|naoki|takumi|kenji|male|男性|男/i;
function pickVoice(){
  if(S.voice){const v=voices.find(v=>v.voiceURI===S.voice);if(v)return v}
  return voices.find(v=>MALE.test(v.name))||null;
}
// 読み上げで読み間違えやすい用語の読み方（画面の表示はそのまま）
const READINGS=[
  ["海技免状","かいぎめんじょう"],["海技免許","かいぎめんきょ"],["海技士","かいぎし"],["海技試験","かいぎしけん"],
  ["管海官庁","かんかいかんちょう"],["端舟","たんしゅう"],["櫓櫂","ろかい"],["帆装","はんそう"],["堪航性","たんこうせい"],
  ["喫水","きっすい"],["解撤","かいてつ"],["毀損","きそん"],["き損","きそん"],["碇泊","ていはく"],["入渠","にゅうきょ"],
  ["船舶件名書","せんぱくけんめいしょ"],["両舷","りょうげん"],["乗揚","のりあげ"],["濫費","らんぴ"],["争闘","そうとう"],
  ["乱酔","らんすい"],["属具","ぞくぐ"],["予後手当","よごてあて"],["漁ろう","ぎょろう"],["とう載","とうさい"],
  ["雇入契約","やといいれけいやく"],["測度","そくど"],["改測","かいそく"],["検認","けんにん"],["点附","てんぷ"],
  ["信号符字","しんごうふじ"],["汽圧","きあつ"],["存否","そんぴ"],["何人","なんぴと"],["湖川","こせん"]
];
function toReading(t){for(const [w,r] of READINGS)t=t.split(w).join(r);return t}
function speak(text){
  text=toReading(text);
  return new Promise(res=>{
    if(!("speechSynthesis" in window)){setTimeout(res,300);return}
    let done=false,guard=null,watch=null;
    const fin=()=>{if(done)return;done=true;clearTimeout(guard);clearInterval(watch);if(current.speakFin===fin)current.speakFin=null;res()};
    current.speakFin=fin;
    try{speechSynthesis.cancel()}catch(e){}
    // 止めた直後に話させると無音で終わらない端末があるので少し待つ
    setTimeout(()=>{
      if(done)return;
      const u=new SpeechSynthesisUtterance(text);
      u.lang="ja-JP";u.rate=1.0;
      const v=pickVoice();
      if(v){u.voice=v;u.pitch=MALE.test(v.name)?1:0.7}else u.pitch=0.7; // 男性音声がない端末は声を低めにする
      u.onend=fin;u.onerror=fin;
      guard=setTimeout(fin,3000+text.length*220);
      let started=Date.now();
      // 読み上げが始まらない・終わったのに知らせが来ない場合の見張り
      watch=setInterval(()=>{if(Date.now()-started>1500&&!speechSynthesis.speaking&&!speechSynthesis.pending)fin()},400);
      try{speechSynthesis.speak(u)}catch(e){fin()}
    },120);
  });
}
function skipSpeak(){try{speechSynthesis.cancel()}catch(e){}if(current.speakFin)current.speakFin()}
const sayText=q=>q.replace(/【[^】]*】/g,"").replace(/第(\d+)条の(\d+)/g,"第$1条の$2");

// ───── 音声認識 ─────
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBroken=false;
function listen(ms,ui){
  // ui: {tick(sec,left), text(final,interim)}  → resolves {type:"answer"|"pass"|"timeout", text}
  return new Promise(resolve=>{
    let final="",interim="",finished=false,rec=null,silence=null;
    const start=Date.now();
    const finish=type=>{
      if(finished)return;finished=true;
      clearInterval(tm);clearTimeout(silence);
      try{rec&&rec.abort()}catch(e){}
      if(current.listen===handle)current.listen=null;
      const t=(final+interim).trim();
      if(type==="timeout"&&t)type="answer";
      resolve({type,text:t});
    };
    const handle={finish};current.listen=handle;
    const tm=ms>0?setInterval(()=>{const left=Math.max(0,ms-(Date.now()-start));ui.tick&&ui.tick(left);if(left<=0)finish("timeout")},100):null;
    const isPass=s=>{const n=norm(s);return /^(ぱす|ぱすします|ぱすで|ぱすです|ぱすでお願いします|ぱすおねがいします|bus|pass|パス)$/.test(n)||(/^ぱす/.test(n)&&n.length<=6)};
    if(!SR||micBroken){ui.fallback&&ui.fallback(v=>{final=v;finish(isPass(v)?"pass":"answer")});return}
    const boot=()=>{
      if(finished)return;
      rec=new SR();rec.lang="ja-JP";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
      rec.onresult=e=>{
        interim="";
        for(let i=e.resultIndex;i<e.results.length;i++){
          const r=e.results[i];
          if(r.isFinal)final+=r[0].transcript;else interim+=r[0].transcript;
        }
        ui.text(final,interim);
        if(ui.check){if(ui.check(final+interim)){finish("answer")}return}
        if(ui.manual)return; // 「回答終了」か「パス」のボタンを押すまで聞き続ける
        if(isPass(final+interim)){finish("pass");return}
        if(/以上です$|以上$/.test(final.trim())){final=final.replace(/以上です?$/,"");finish("answer");return}
        clearTimeout(silence);
        if((final+interim).trim())silence=setTimeout(()=>finish("answer"),ui.silence||2200);
      };
      rec.onerror=e=>{
        if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"){
          micBroken=true;ui.error&&ui.error(e.error);ui.fallback&&ui.fallback(v=>{final=v;finish(isPass(v)?"pass":"answer")});
        }
      };
      rec.onend=()=>{if(!finished&&!micBroken)setTimeout(boot,120)};
      try{rec.start()}catch(e){setTimeout(boot,300)}
    };
    boot();
  });
}

// ───── 画面管理 ─────
let view="home";
let current={listen:null,timer:null,exam:null,speakFin:null,pending:null};
let gen=0; // 画面が切り替わるたびに増やし、古い出題の続きが動かないようにする
function stopAll(){
  gen++;current.pending=null;
  if(current.listen)current.listen.finish("abort");
  if(current.timer)clearInterval(current.timer);
  current.timer=null;
  skipSpeak();
}

function upsell(msg){
  return `<div class="ansbox stack" style="gap:8px">${msg?`<div class="small">${msg}</div>`:""}
    ${NOTE_URL?`<a class="btn wide" style="text-align:center;text-decoration:none" href="${NOTE_URL}" target="_blank" rel="noopener">完全版（全146問）はこちら（note）</a>`:`<div class="small muted">完全版は note で販売予定です。</div>`}</div>`;
}
function pick5(s){
  if(EDITION==="trial")return BANK.filter(b=>b.s===s).slice(0,5).map(p=>({it:p,q:p.q,status:"wait",text:"",r:null,hits:null}));
  const pool=BANK.filter(b=>b.s===s).map(b=>({b,w:S.weighted?ycount(b):1}));
  const out=[];
  while(out.length<5&&pool.length){
    const sum=pool.reduce((a,p)=>a+p.w,0);let r=Math.random()*sum,i=0;
    for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break}
    const p=pool.splice(Math.min(i,pool.length-1),1)[0].b;
    const q=p.v?p.v[Math.floor(Math.random()*p.v.length)]:p.q;
    out.push({it:p,q,status:"wait",text:"",r:null,hits:null});
  }
  return out;
}
function startExam(){
  // iOSの読み上げを解禁するため、タップ直後に短く話す
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}
  current.exam={subjects:S.subjects.slice(),si:0,results:[]};
  runSubject();
}
const LIMIT=180;
const fmt=sec=>{sec=Math.max(0,sec);return `${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,"0")}`};
function paintClock(R){
  const t=$("#wt"),bar=$("#bar");
  if(t){t.innerHTML=`${fmt(R.elapsed)}<small>/ 3:00</small>`;t.classList.toggle("low",LIMIT-R.elapsed<=30)}
  if(bar)bar.style.width=Math.min(100,R.elapsed/LIMIT*100)+"%";
}
async function runSubject(){
  stopAll();const g=gen;
  const E=current.exam;
  const s=E.subjects[E.si];
  const qs=pick5(s);
  const R={s,qs,elapsed:0};
  E.results.push(R);
  let over=false;
  renderExamShell(R,null);
  await speak(`${SUBJECTS[s]}の試験を始めます。`);
  if(g!==gen)return;
  // ここから3分。読み上げも回答も含めて止まらない
  const t0=Date.now();
  const myTimer=current.timer=setInterval(()=>{
    if(g!==gen){clearInterval(myTimer);return}
    R.elapsed=(Date.now()-t0)/1000;paintClock(R);
    if(R.elapsed>=LIMIT&&!over){over=true;R.elapsed=LIMIT;stopAll();timeUp()}
  },100);
  const ask=async qi=>{
    const Q=qs[qi];Q.status="cur";current.pending=null;renderExamShell(R,qi);
    setMic("speak");
    await speak(sayText(Q.q));
    if(over||g!==gen)return "over";
    if(current.pending==="pass"){current.pending=null;Q.status="pass";Q.wasPassed=true;Q.text="";return "pass"}
    current.pending=null;
    setMic("listening");
    const res=await listen(0,{
      manual:true,
      text:(f,i)=>{const h=$("#heard");if(h)h.innerHTML=esc(f)+`<span class="interim">${esc(i)}</span>`},
      error:()=>{const st=$("#status");if(st)st.textContent="マイクが使えません。文字で回答してください"},
      fallback:cb=>{const f=$("#fb");if(f){f.hidden=false;const inp=$("#fbin");inp.value="";inp.focus();$("#fbform").onsubmit=e=>{e.preventDefault();cb(inp.value)}}}
    });
    if(over||g!==gen||res.type==="abort")return "over";
    if(res.type==="pass"){Q.status="pass";Q.wasPassed=true;Q.text="";return "pass"}
    Q.text=res.text||"";const gr=grade(Q.it,Q.text);Q.hits=gr.hits;Q.r=Q.text?gr.r:"ng";Q.status="done";
    return "done";
  };
  for(let i=0;i<qs.length;i++){const r=await ask(i);if(r==="over")return}
  while(!over){
    const pend=qs.map((q,i)=>q.status==="pass"?i:-1).filter(i=>i>=0);
    if(!pend.length)break;
    await speak("パスした問題に戻ります。");if(over||g!==gen)return;
    for(const i of pend){const r=await ask(i);if(r==="over")return}
  }
  if(over||g!==gen)return;
  over=true;clearInterval(myTimer);current.timer=null;
  await speak(`${SUBJECTS[s]}の試験を終わります。`);
  subjectEnd(false);
}
function timeUp(){
  const R=current.exam.results.at(-1);
  R.qs.forEach(q=>{if(q.status!=="done")q.status="skip"});
  speak("時間です。");
  subjectEnd(true);
}

function qs_back(R,qi){return R.qs[qi].wasPassed}
function reviewHTML(Q){
  const it=Q.it;
  return `<div class="ansbox">
    <div class="lbl">あなたの回答</div>
    <p class="model" style="color:var(--muted)">${Q.text?esc(Q.text):"（回答なし）"}</p>

  </div>`;
}
function showVerdict(R,qi){
  return new Promise(res=>{
    const Q=R.qs[qi];
    const box=document.createElement("div");box.className="stack";box.id="vbox";
    box.innerHTML=reviewHTML(Q)+`
      <button class="btn ghost wide" id="hear">模範解答を聞く</button>

      <div class="ctrl"><button class="btn" id="fixok">言えた</button><button class="btn ghost" id="fixng">言えなかった</button></div>`;
    box.querySelector("#hear").onclick=()=>speak(Q.it.a.replace(/[／\n]/g,"、"));
    const go=v=>{Q.r=v;skipSpeak();box.remove();res()};
    box.querySelector("#fixok").onclick=()=>go("ok");

    $("#status").textContent="模範解答を確認（時計は止まっています）";
    box.scrollIntoView({behavior:"smooth",block:"start"});
  });
}

  <div class="stack" style="gap:4px"><div class="eyebrow">RESULT</div><h1>言えた ${tot} / ${all}</h1></div>
  <div class="score">${E.results.map(R=>`<div><b>${R.qs.filter(q=>q.r==="ok").length}/5</b><span>${SHORT[R.s]}</span></div>`).join("")}</div>
  ${E.results.map((R,ri)=>`<section class="stack"><h2>${SUBJECTS[R.s]}</h2><div class="res">${R.qs.map((q,qi)=>{
    const st=q.status==="skip"?"skip":q.r;
    return `<div class="ritem ${st}" data-r="${ri}" data-q="${qi}">
      <div><span class="tag ${st}">${VERD[st]}</span><span class="yr">${ylabel(q.it)}</span></div>
      <div class="q">${esc(q.q)}</div>
      <div class="small muted">あなたの回答：${q.text?esc(q.text):"（なし）"}</div>
      <div class="small" style="margin-top:6px;color:var(--brass);font-weight:700">模範解答</div><p class="model">${esc(q.it.a)}</p>
      <div class="row" style="margin-top:6px"><button class="chip fx" data-v="ok" aria-pressed="${q.r==="ok"}">言えた</button><button class="chip fx" data-v="ng" aria-pressed="${q.r==="ng"&&q.status!=="skip"}">言えなかった</button></div>
    </div>`}).join("")}</div></section>`).join("")}
  <button class="btn big wide" id="again">もう一度</button>
  <button class="btn ghost wide" id="home">メニューへ</button>`;
  document.querySelectorAll(".fx").forEach(b=>b.onclick=()=>{const d=b.closest(".ritem");const q=E.results[+d.dataset.r].qs[+d.dataset.q];q.r=b.dataset.v;if(q.status==="skip")q.status="done";const y=window.scrollY;renderResults();window.scrollTo(0,y)});
  $("#again").onclick=startExam;$("#home").onclick=()=>{stopAll();renderHome()};
}

// ───── 重要論点順の一問一答（口述で回答） ─────
function drillPool(subject){
  const items=[];
  BANK.filter(b=>subject<0||b.s===subject).forEach(b=>{
    (b.v||[b.q]).forEach((q,vi)=>items.push({it:b,q,vi,imp:ycount(b)}));
  });
  return items;
}
function sortImp(items){return items.slice().sort((a,b)=>b.imp-a.imp||a.it.s-b.it.s||a.it.id-b.it.id||a.vi-b.vi)}
function startOx(){
  let items=drillPool(S.oxSubject);
  items=S.oxOrder==="imp"?sortImp(items):items.sort(()=>Math.random()-.5);
  if(S.oxCount)items=items.slice(0,S.oxCount);
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}
  current.ox={items:items.map(x=>Object.assign({},x,{text:"",r:null,hits:null,status:"wait"})),i:0,round:1};
  renderOx();
}
function renderOx(){
  stopAll();view="ox";
  const O=current.ox;const Q=O.items[O.i];
  app.innerHTML=`
  <div class="row between"><div><div class="eyebrow">一問一答 ${S.oxSubject<0?"全科目":SHORT[S.oxSubject]}${O.round>1?"（パスした問題）":""}</div><h2 class="prog">第${O.i+1}問 / ${O.items.length}</h2></div>
    <button class="btn ghost" id="oxquit">やめる</button></div>
  <div style="height:6px;background:var(--soft);border-radius:3px;overflow:hidden"><i style="display:block;height:100%;width:${O.i/O.items.length*100}%;background:var(--navy)"></i></div>
  <div class="qcard">
    <div class="yr">${SHORT[Q.it.s]}・出題 ${ylabel(Q.it)}（${Q.imp}回）</div>
    <div class="qtext ${S.showText?"":"hidden-q"}">${esc(Q.q)}</div>
  </div>
  <button class="btn ghost wide" id="bshow">模範解答を見る</button>
  <div class="ansbox" id="ansbox" hidden><div class="lbl">模範解答</div><p class="model">${esc(Q.it.a)}</p></div>
  <div class="card mic">
    <div class="stack" style="gap:8px;min-width:0;grid-column:1/-1"><div class="microw"><span class="micdot" id="micdot"></span><div class="status" id="status">出題中…</div></div><div class="heard" id="heard"></div></div>
  </div>
  <div id="fb" hidden><form id="fbform" class="fallback"><input id="fbin" autocomplete="off" placeholder="回答を入力"><button class="btn">回答</button></form></div>
  <div class="ctrl" id="pctrl"><button class="btn ghost" id="bpass">パス</button><button class="btn" id="bdone">回答終了</button></div>
  <div class="row">${O.i>0?`<button class="btn ghost" id="oxprev">前の問題</button>`:""}<button class="btn ghost" id="oxagain">もう一度読む</button></div>`;
  $("#oxquit").onclick=()=>renderOxResult();
  if($("#oxprev"))$("#oxprev").onclick=()=>{O.i--;renderOx()};
  $("#oxagain").onclick=()=>run();
  $("#bshow").onclick=()=>{const b=$("#ansbox");b.hidden=!b.hidden;$("#bshow").textContent=b.hidden?"模範解答を見る":"模範解答を隠す"};
  $("#bpass").onclick=()=>{if(current.listen)current.listen.finish("pass");else if(current.speakFin){current.pending="pass";skipSpeak()}};
  $("#bdone").onclick=()=>{if(current.listen)current.listen.finish("answer");else if(current.speakFin)skipSpeak()};
  async function run(){
    stopAll();const g=gen;
    $("#heard").innerHTML="";$("#status").textContent="出題中…";
    await speak(sayText(Q.q));
    if(g!==gen)return;
    if(current.pending==="pass"){current.pending=null;return afterAnswer({type:"pass",text:""})}
    $("#status").textContent="回答してください（答え終わったら「回答終了」を押す）";$("#micdot").classList.add("on");
    const res=await listen(0,{
      manual:true,
      text:(f,i)=>{const h=$("#heard");if(h)h.innerHTML=esc(f)+`<span class="interim">${esc(i)}</span>`},
      error:()=>{const st=$("#status");if(st)st.textContent="マイクが使えません。文字で回答してください"},
      fallback:cb=>{const f=$("#fb");if(f){f.hidden=false;const inp=$("#fbin");inp.value="";inp.focus();$("#fbform").onsubmit=e=>{e.preventDefault();cb(inp.value)}}}
    });
    if(g!==gen||res.type==="abort")return;
    const md=$("#micdot");if(md)md.classList.remove("on");
    afterAnswer(res);
  }
  function afterAnswer(res){
    const g=gen;
    if(res.type==="pass"){Q.status="pass";Q.text="";return nextOx()}
    Q.text=res.text||"";const gr=grade(Q.it,Q.text);Q.hits=gr.hits;Q.r=Q.text?gr.r:"ng";Q.status="done";
    if(!S.oxJudge)return nextOx();
    $("#pctrl").hidden=true;$("#fb").hidden=true;$("#ansbox").hidden=true;$("#bshow").hidden=true;$("#oxagain").hidden=true;
    $("#status").textContent="模範解答を確認";
    const box=document.createElement("div");box.className="stack";
    box.innerHTML=reviewHTML(Q)+`
      <button class="btn ghost wide" id="hear">模範解答を聞く</button>
      <div class="small muted">模範解答どおりに言えましたか？</div>
      <div class="ctrl"><button class="btn" id="fixok">言えた</button><button class="btn ghost" id="fixng">言えなかった</button></div>`;
    document.querySelector(".mic").after(box);
    box.querySelector("#hear").onclick=()=>speak(Q.it.a.replace(/[／\n]/g,"、"));
    box.querySelector("#fixok").onclick=()=>{Q.r="ok";nextOx()};
    box.querySelector("#fixng").onclick=()=>{Q.r="ng";nextOx()};
    box.scrollIntoView({behavior:"smooth",block:"start"});
  }
  run();
}
function nextOx(){
  stopAll();const O=current.ox;
  if(O.i<O.items.length-1){O.i++;renderOx();window.scrollTo(0,0);return}
  // 最後まで行ったら、パスした問題をもう一度
  const passed=O.items.filter(q=>q.status==="pass");
  if(passed.length&&O.round===1){
    O.done=O.items.filter(q=>q.status!=="pass");O.items=passed;O.i=0;O.round=2;
    speak("パスした問題に戻ります。").then(()=>{});renderOx();return;
  }
  renderOxResult();
}
function renderOxResult(){
  stopAll();view="oxres";const O=current.ox;
  const all=(O.done||[]).concat(O.items);
  const done=all.filter(q=>q.status==="done"||q.status==="pass");
  const ok=done.filter(q=>q.r==="ok").length;
  app.innerHTML=`
  <div class="stack" style="gap:4px"><div class="eyebrow">一問一答 結果</div><h1>言えた ${ok} / ${done.length}</h1></div>
  <div class="row"><button class="chip" id="fall" aria-pressed="true">すべて</button><button class="chip" id="fng" aria-pressed="false">言えなかった問題だけ</button></div>
  <div class="res" id="oxr">${done.map((q,i)=>{const st=q.status==="pass"?"skip":q.r;return `<div class="ritem ${st}" data-i="${i}" data-r="${q.r==="ok"?"ok":"ng"}">
    <div><span class="tag ${st}">${VERD[st]}</span><span class="yr">${SHORT[q.it.s]}・${ylabel(q.it)}</span></div>
    <div class="q">${esc(q.q)}</div>
    <div class="small muted">あなたの回答：${q.text?esc(q.text):"（なし）"}</div>
    <div class="small" style="margin-top:6px;color:var(--brass);font-weight:700">模範解答</div><p class="model">${esc(q.it.a)}</p>
    <div class="row" style="margin-top:6px"><button class="chip fx" data-v="ok" aria-pressed="${q.r==="ok"}">言えた</button><button class="chip fx" data-v="ng" aria-pressed="${q.r!=="ok"&&q.status==="done"}">言えなかった</button></div></div>`}).join("")||`<p class="muted">回答した問題がありません。</p>`}</div>
  <button class="btn big wide" id="oxretry">言えなかった問題をもう一度</button>
  <button class="btn ghost wide" id="home">メニューへ</button>`;
  const filt=ng=>{document.querySelectorAll("#oxr .ritem").forEach(d=>d.hidden=ng&&d.dataset.r==="ok");$("#fall").setAttribute("aria-pressed",!ng);$("#fng").setAttribute("aria-pressed",ng)};
  $("#fall").onclick=()=>filt(false);$("#fng").onclick=()=>filt(true);
  document.querySelectorAll("#oxr .fx").forEach(b=>b.onclick=()=>{const d=b.closest(".ritem");const q=done[+d.dataset.i];q.r=b.dataset.v;if(q.status==="pass")q.status="done";const y=window.scrollY;renderOxResult();window.scrollTo(0,y)});
  const wrong=done.filter(q=>q.r!=="ok");
  $("#oxretry").disabled=!wrong.length;
  $("#oxretry").onclick=()=>{current.ox={items:wrong.map(x=>Object.assign({},x,{text:"",r:null,hits:null,status:"wait"})),i:0,round:1};renderOx()};
  $("#home").onclick=renderHome;
}
function renderOxList(){
  stopAll();view="oxlist";
  const items=sortImp(drillPool(S.oxSubject));
  app.innerHTML=`
  <div class="row between"><div><div class="eyebrow">重要論点順 一覧</div><h2>${S.oxSubject<0?"全科目":SUBJECTS[S.oxSubject]}（${items.length}問）</h2></div><button class="btn ghost" id="home">戻る</button></div>
  <div class="row"><span class="small muted">模範解答を</span><button class="chip" id="hide" aria-pressed="false">隠す</button></div>
  <div class="res">${items.map(x=>`<div class="ritem">
    <div class="yr">${SHORT[x.it.s]}・出題 ${ylabel(x.it)}（${x.imp}回）</div>
    <div class="q">${esc(x.q)}</div>
    <div class="ansline"><div class="small" style="margin-top:6px;color:var(--brass);font-weight:700">模範解答</div><p class="model">${esc(x.it.a)}</p></div></div>`).join("")}</div>`;
  $("#home").onclick=renderHome;
  $("#hide").onclick=e=>{const on=e.target.getAttribute("aria-pressed")!=="true";e.target.setAttribute("aria-pressed",on);document.querySelectorAll(".ansline").forEach(d=>d.style.visibility=on?"hidden":"visible")};
}

// 古い版がスマホに残っていたら、自動で最新版に入れ替える
const BUILD="2026-11-06-1010";
(async()=>{try{
  const r=await fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"});if(!r.ok)return;
  const t=await r.text();const m=t.match(/const BUILD="([^"]+)"/);
  if(!m||m[1]===BUILD)return;
  let tried=null;try{tried=sessionStorage.getItem("kj_reload")}catch(e){}
  if(tried===m[1])return;try{sessionStorage.setItem("kj_reload",m[1])}catch(e){}
  try{for(const k of await caches.keys()){const c=await caches.open(k);for(const q of await c.keys())if(q.url.includes("/koujutsu/"))await c.delete(q)}}catch(e){}
  location.replace(location.pathname+"?v="+m[1]);
}catch(e){}})();
try{const wl=navigator.wakeLock&&navigator.wakeLock.request("screen");wl&&wl.catch(()=>{})}catch(e){}
boot();
function boot(){
  if(EDITION!=="full"){initBank();renderHome();return}
  let saved="";try{saved=localStorage.getItem("kaiji_pass")||""}catch(e){}
  if(saved)unlock(saved).then(ok=>ok?(initBank(),renderHome()):renderGate("")) ;else renderGate("");
}
async function unlock(pass){
  try{
    const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass.normalize("NFKC").trim().toLowerCase()),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:ENC.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.i)},key,b64(ENC.c));
    const arr=JSON.parse(new TextDecoder().decode(pt));
    BANK.length=0;arr.forEach(x=>BANK.push(x));
    try{localStorage.setItem("kaiji_pass",pass)}catch(e){}
    return true;
  }catch(e){return false}
}
function renderGate(err){
  view="gate";
  app.innerHTML=`
  <header class="stack" style="gap:4px"><div class="eyebrow">MARITIME AGENT ORAL EXAM</div><h1>海事代理士 口述トレーナー</h1><div class="muted small">完全版（令和元年〜令和7年・全146問）</div></header>
  <form class="card stack" id="gate">
    <label for="pass"><b>合言葉</b><span class="sub muted small" style="display:block">noteの記事（購入後に表示される部分）に書いてある合言葉を入れてください。</span></label>
    <input id="pass" autocomplete="off" autocapitalize="off" spellcheck="false" style="font:inherit;font-size:1.1rem;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)">
    ${err?`<div class="small" style="color:var(--ng);font-weight:700">${err}</div>`:""}
    <button class="btn big wide">開く</button>
  </form>`;
  $("#gate").onsubmit=async e=>{e.preventDefault();const p=$("#pass").value;if(!p.trim())return;
    $("#gate button").disabled=true;$("#gate button").textContent="確認中…";
    if(await unlock(p)){initBank();renderHome()}else renderGate("合言葉が違います。noteの記事で最新の合言葉を確認してください。")};
}
