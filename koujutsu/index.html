<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>海事代理士 口述トレーナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 試験室の答案用紙：紺の罫と真鍮色の目印。上部に科目と残り時間、中央に設問カード */
:root{
  --bg:#EEF1F2; --paper:#FFFFFF; --ink:#14232F; --muted:#5B6B77; --line:#D3DBE0;
  --navy:#1D4466; --navy-ink:#FFFFFF; --brass:#9C7A2E; --ok:#1E7A4F; --ng:#B3362F; --part:#A86B12;
  --ok-bg:#E3F2EA; --ng-bg:#F8E5E3; --part-bg:#FBF0DC; --soft:#E4EAEE;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E161D; --paper:#16222C; --ink:#E6ECEF; --muted:#94A3AE; --line:#2A3A46;
  --navy:#5B8DB8; --navy-ink:#0E161D; --brass:#CDAA5C; --ok:#5CC08E; --ng:#E77B72; --part:#E0A84E;
  --ok-bg:#16301F; --ng-bg:#36201E; --part-bg:#33281A; --soft:#1E2C37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161D; --paper:#16222C; --ink:#E6ECEF; --muted:#94A3AE; --line:#2A3A46;
  --navy:#5B8DB8; --navy-ink:#0E161D; --brass:#CDAA5C; --ok:#5CC08E; --ng:#E77B72; --part:#E0A84E;
  --ok-bg:#16301F; --ng-bg:#36201E; --part-bg:#33281A; --soft:#1E2C37; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.model{font-size:1.05rem;line-height:1.85;white-space:pre-line;margin:4px 0 0;font-weight:500}
.ansbox{background:var(--paper);border:1px solid var(--brass);border-radius:10px;padding:16px}
.ansbox .lbl{font-size:.75rem;letter-spacing:.12em;color:var(--brass);font-weight:700}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.25rem;font-weight:800}
.eyebrow{font-size:.75rem;letter-spacing:.14em;color:var(--brass);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.tabs button{border:0;background:transparent;color:var(--muted);padding:12px;font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--navy);color:var(--navy-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set label{font-weight:500}
.set .sub{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-width:55vw}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:.2s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--paper);transition:.2s;box-shadow:0 1px 2px #0003}
.sw input:checked+span{background:var(--navy)}
.sw input:checked+span::after{transform:translateX(22px)}
.sw input:focus-visible+span{outline:2px solid var(--brass);outline-offset:2px}
.btn{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:var(--navy-ink);padding:12px 18px;cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.wide{width:100%}
.btn.big{font-size:1.1rem;padding:16px}
.btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.yr{font-size:.72rem;letter-spacing:.06em;color:var(--brass);font-weight:700}
/* exam */
.examhead{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.clock{font-family:var(--f-disp);font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.clock.low{color:var(--ng)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--navy);transition:width .5s linear}
.steps{display:flex;gap:6px}
.steps b{width:26px;height:8px;border-radius:2px;background:var(--soft)}
.steps b.done{background:var(--navy)}.steps b.pass{background:var(--brass)}.steps b.cur{background:var(--ink)}
.qcard{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:10px;padding:20px 18px;min-height:150px}
.qtext{font-family:var(--f-disp);font-size:1.2rem;font-weight:600;line-height:1.75}
.qtext.hidden-q{color:transparent;text-shadow:0 0 12px var(--muted);user-select:none}
.mic{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.status{font-weight:700}
.heard{min-height:2.6em;padding:10px 12px;border-radius:8px;background:var(--soft);font-size:1rem;word-break:break-all}
.heard .interim{color:var(--muted)}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fallback{display:flex;gap:8px}
.fallback input{flex:1;min-width:0;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.verdict{border-radius:10px;padding:16px;border:1px solid var(--line)}
.verdict.ok{background:var(--ok-bg);border-color:var(--ok)}
.verdict.ng{background:var(--ng-bg);border-color:var(--ng)}
.verdict.part{background:var(--part-bg);border-color:var(--part)}
.vt{font-family:var(--f-disp);font-size:1.35rem;font-weight:800}
.ok .vt{color:var(--ok)}.ng .vt{color:var(--ng)}.part .vt{color:var(--part)}
.ans{white-space:pre-line;margin:6px 0 0}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.key{font-size:.78rem;padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.key.hit{border-color:var(--ok);color:var(--ok);font-weight:700}
.res{display:flex;flex-direction:column;gap:10px}
.ritem{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:12px;background:var(--paper)}
.ritem.ok{border-left-color:var(--ok)}.ritem.ng{border-left-color:var(--ng)}.ritem.part{border-left-color:var(--part)}.ritem.skip{border-left-color:var(--brass)}
.ritem .q{font-weight:700}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:4px;margin-right:6px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.ng{background:var(--ng-bg);color:var(--ng)}.tag.part{background:var(--part-bg);color:var(--part)}.tag.skip{background:var(--soft);color:var(--brass)}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.score div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.score b{display:block;font-family:var(--f-disp);font-size:1.4rem;font-variant-numeric:tabular-nums}
.score span{font-size:.72rem;color:var(--muted)}
details summary{cursor:pointer;color:var(--navy);font-weight:700}
/* 肢別 */
.ox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ox button{font-family:var(--f-disp);font-size:2.4rem;font-weight:800;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.ox button.o:hover,.ox button.o.sel{border-color:var(--ok);color:var(--ok)}
.ox button.x:hover,.ox button.x.sel{border-color:var(--ng);color:var(--ng)}
.ox button:disabled{cursor:default}
.stmt{font-size:1.1rem;line-height:1.85;font-weight:500}
.prog{font-variant-numeric:tabular-nums}
@media (max-width:400px){.score{grid-template-columns:repeat(2,1fr)}.qtext{font-size:1.1rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// 口述問題データ（令和元年〜令和7年を統合・重複整理）
// s:科目 y:出題年 q:問題 v:別パターンの問い方 a:模範解答 k:判定キーワード群（|は言い換え） n:必要数 t:肢別（先頭○×、｜以降は解説）
const SUBJECTS=["船員法","船舶法","船舶職員及び小型船舶操縦者法","船舶安全法"];
const SHORT=["船員法","船舶法","船舶職員法","船舶安全法"];
const BANK=[
// ───────── 船員法 ─────────
{s:0,y:"4,7",q:"船員法第23条に規定される、懲戒の種類を2つお答えください。",a:"上陸禁止\n戒告",k:["上陸禁止|上陸","戒告|かいこく"],t:["○船員法上の懲戒の種類は、上陸禁止と戒告である。","×船員法上の懲戒の種類には、上陸禁止、戒告のほか減給がある。｜懲戒は上陸禁止と戒告の2種類のみ。"]},
{s:0,y:"3,5,7",q:"船員法第5条第1項により船舶所有者の規定の適用を受ける者を、船舶共有の場合と船舶貸借の場合、それぞれお答えください。",a:"船舶共有の場合：船舶管理人\n船舶貸借の場合：船舶借入人",k:["管理人","借入人|借り入れ人|借りいれ人|借受人|借り受け人"],t:["○船舶共有の場合、船員法の船舶所有者に関する規定は船舶管理人に適用される。","×船舶貸借の場合、船員法の船舶所有者に関する規定は船舶の貸主に適用される。｜船舶貸借の場合は船舶借入人に適用される。"]},
{s:0,y:"元,4,6",q:"船員法第4条に規定される「労働時間」の定義を、船員と海員それぞれの観点からお答えください。",a:"船員：職務上必要な作業に従事する時間\n海員：上長の職務上の命令により作業に従事する時間に限る",k:["職務上必要|必要な作業","上長|命令"],t:["○海員の労働時間は、上長の職務上の命令により作業に従事する時間に限られる。","×船員法上の労働時間とは、船員が船内にいる全ての時間をいう。｜職務上必要な作業に従事する時間。"]},
{s:0,y:"元,4,7",q:"雇入契約の成立の届出をするときに、届出書の提出に加えて提示すべき書類を2つお答えください。",a:"海員名簿\n船員手帳\n（資格を要する船員は）海技免状・小型船舶操縦免許証その他の資格証明書",k:["海員名簿","船員手帳","海技免状|操縦免許証|資格証明|免許"],n:2,t:["○雇入契約の成立の届出をするときは、海員名簿と船員手帳を提示する。","×雇入契約の成立の届出をするときは、船舶検査証書を提示しなければならない。｜提示するのは海員名簿、船員手帳、資格証明書。"]},
{s:0,y:"元,4,6",q:"船員法第79条で、第7章の有給休暇に関する規定が適用されない船舶を2つお答えください。",a:"漁船\n船舶所有者と同一の家庭に属する者のみを使用する船舶",k:["漁船","同一の家庭|家庭|家族"],t:["○漁船には、船員法第7章の有給休暇に関する規定は適用されない。","×旅客船には、船員法第7章の有給休暇に関する規定は適用されない。｜適用除外は漁船と、船舶所有者と同一の家庭に属する者のみを使用する船舶。"]},
{s:0,y:"元,4,6",q:"船員法第82条の2で、衛生管理者を選任しなければならない船舶は、国土交通省令で定める漁船のほか何がありますか。",a:"遠洋区域又は近海区域を航行区域とする総トン数3,000トン以上の船舶",k:["遠洋|近海","3000"],t:["○遠洋区域又は近海区域を航行区域とする総トン数3,000トン以上の船舶は、衛生管理者を選任しなければならない。","×沿海区域を航行区域とする総トン数700トン以上の船舶は、衛生管理者を選任しなければならない。｜遠洋・近海区域で総トン数3,000トン以上。700トンは食料表の基準。"]},
{s:0,y:"元,3,6",q:"沿海区域又は平水区域を航行区域とし国内各港間のみを航海する船舶の船員に与える有給休暇は、最初の連続した勤務6箇月について原則何日、その後連続した勤務3箇月を増すごとに何日ですか。",a:"最初の連続した勤務6箇月：10日\n連続した勤務3箇月ごと：3日",k:["10日|とおか","3日|みっか"],t:["○国内各港間のみを航海する沿海・平水区域の船舶では、最初の連続した勤務6箇月について10日の有給休暇を与える。","×国内各港間のみを航海する沿海・平水区域の船舶では、連続した勤務3箇月を増すごとに5日を加える。｜3日を加える。"]},
{s:0,y:"3,6",q:"船員法施行規則第35条に規定される船員手帳の有効期間を、日本人が受有する場合と外国人が受有する場合、それぞれお答えください。",a:"日本人：交付日から10年\n外国人：交付日から5年",k:["10年","5年"],t:["○日本人が受有する船員手帳の有効期間は、交付日から10年である。","×外国人が受有する船員手帳の有効期間は、交付日から10年である。｜外国人は5年。"]},
{s:0,y:"3,6",q:"船員法第65条の2に規定される労働時間の限度は、1日当たり及び1週間当たりそれぞれ何時間ですか。",a:"1日当たり：14時間\n1週間当たり：72時間",k:["14","72"],t:["○船員の労働時間の限度は、1日当たり14時間、1週間当たり72時間である。","×船員の労働時間の限度は、1日当たり12時間、1週間当たり60時間である。｜14時間・72時間。"]},
{s:0,y:"2,6",q:"船員法第21条で、海員が守らなければならない事項を2つお答えください。",a:"上長の職務上の命令に従う／職務を怠り又は他の乗組員の職務を妨げない／船長の指定する時までに乗り込む／船長の許可なく船舶を去らない／許可なく救命艇等の重要な属具を使用しない／食料又は淡水を濫費しない／許可なく電気・火気を使用し、又は禁止場所で喫煙しない／許可なく日用品以外の物品を持ち込み・持ち出さない／争闘・乱酔その他粗暴の行為をしない／その他船内の秩序を乱さない",k:["命令に従|命令","怠|妨げ","乗り込","去らない|離れない","救命艇|属具","食料|淡水|濫費","電気|火気|喫煙","持ち込|持ち出|日用品","争闘|乱酔|粗暴|喧嘩","秩序"],n:2,t:["○海員は、船長の許可なく船舶を去ってはならない。","○海員は、船内の食料又は淡水を濫費してはならない。","×海員は、船長の許可があっても日用品以外の物品を船内に持ち込んではならない。｜船長の許可があれば持ち込める。禁止されているのは「許可なく」持ち込むこと。"]},
{s:0,y:"元,6",q:"船員法第4条に規定される「給料」の定義をお答えください。",a:"船舶所有者が船員に対し一定の金額により定期に支払う報酬のうち基本となるべき固定給",k:["一定の金額|一定金額|一定額","定期","固定給|基本"],n:2,t:["○給料とは、船舶所有者が船員に対し一定の金額により定期に支払う報酬のうち基本となるべき固定給をいう。","×給料とは、船舶所有者が船員に支払う時間外手当を含む報酬の全てをいう。｜基本となるべき固定給。"]},
{s:0,y:"2,6",q:"船員法第41条第1項で、船員が雇入契約を解除することができる場合を2つお答えください。",a:"船舶が雇入契約成立時の国籍を失ったとき／雇入契約の労働条件と事実とが著しく相違するとき／船員が負傷又は疾病のため職務に堪えないとき／船員が省令の定めにより教育を受けようとするとき",k:["国籍","相違|違う|異なる","負傷|疾病|病気|けが","教育"],n:2,t:["○船舶が雇入契約の成立の時における国籍を失ったときは、船員は雇入契約を解除することができる。","×船員が教育を受けようとするときであっても、船員は雇入契約を解除することはできない。｜省令の定めにより教育を受けようとするときは解除できる。"]},
{s:0,y:"2,6",q:"船員法第86条で、18歳未満の船員を夜間作業に従事させてはならないとされていますが、この規定が適用されない船舶を2つお答えください。",a:"漁船\n船舶所有者と同一の家庭に属する者のみを使用する船舶",k:["漁船","同一の家庭|家庭|家族"],t:["○船舶所有者と同一の家庭に属する者のみを使用する船舶には、18歳未満の夜間作業禁止の規定は適用されない。"]},

{s:1,y:"2,3,4,5,7",q:"管海官庁の窓口において船舶国籍証書の交付を申請する場合の手数料の納付方法をお答えください。",v:["管海官庁の窓口において船舶国籍証書の交付を申請する場合の手数料の納付方法をお答えください。","管海官庁の窓口において船籍港の変更の登録を申請する場合の手数料の納付方法をお答えください。","日本国内で総トン数の改測を受けた場合の、管海官庁の窓口における手数料の納付方法をお答えください。","日本国内の管海官庁の窓口において仮船舶国籍証書の交付を申請する場合の手数料の納付方法をお答えください。"],a:"手数料納付書に、手数料額に相当する収入印紙を貼付して納付する。\n（国籍証書・仮証書の交付、変更登録、測度・改測）",k:["納付書","収入印紙|印紙"],t:["○管海官庁の窓口で船舶国籍証書の交付を申請する場合は、手数料納付書に手数料額に相当する収入印紙を貼って納付する。","×総トン数の改測の手数料は、申請書に収入印紙を貼って納付する。｜改測（測度）手数料は手数料納付書に収入印紙。"]},
{s:1,y:"2,3,4,5",q:"管海官庁の窓口において登録事項証明書の交付を申請する場合の手数料の納付方法をお答えください。",v:["管海官庁の窓口において船舶原簿の閲覧を申請する場合の手数料の納付方法をお答えください。","管海官庁の窓口において総トン数計算書の謄本の交付を申請する場合の手数料の納付方法をお答えください。","管海官庁の窓口において登録事項証明書の交付を申請する場合の手数料の納付方法をお答えください。","管海官庁の窓口において総トン数計算書の抄本の交付を申請する場合の手数料の納付方法をお答えください。"],a:"申請書に、手数料額に相当する収入印紙を貼付して納付する。\n（閲覧、謄本・抄本、登録事項証明書）",k:["申請書","収入印紙|印紙"],t:["○管海官庁の窓口で登録事項証明書の交付を申請する場合は、申請書に手数料額に相当する収入印紙を貼って納付する。","×船舶原簿の閲覧の手数料は、手数料納付書に収入印紙を貼って納付する。｜閲覧・謄抄本・登録事項証明は「申請書」に収入印紙。"]},
{s:1,y:"2,4,5,7",q:"船舶国籍証書の交付を受けている船舶の総トン数に変更があった場合の手続きを、誰が・どこに・何をすべきか順にお答えください。",a:"①船舶所有者は ②船籍港を管轄する管海官庁に ③総トン数の改測を申請 ④（改測後）管海官庁に変更登録を申請 ⑤変更登録の申請と同時に船舶国籍証書の書換を申請 ⑥（書換後遅滞なく）書換前の証書を返還",k:["改測","変更登録","書換|書き換え|書きかえ","返還"],n:3,t:["○総トン数に変更があった場合、船舶所有者は船籍港を管轄する管海官庁に総トン数の改測を申請しなければならない。","×総トン数に変更があった場合、船舶所有者はまず船籍港を管轄する登記所に変更の登記を申請しなければならない。｜総トン数の変更はまず管海官庁へ改測申請。登記所から始まるのは住所・氏名の変更や譲渡。"]},
{s:1,y:"2,3,4,5",q:"船舶国籍証書の交付を受けている船舶の所有者の住所に変更があった場合の手続きを、誰が・どこに・何をすべきか順にお答えください。",v:["船舶国籍証書の交付を受けている船舶の所有者の住所に変更があった場合の手続きを、誰が・どこに・何をすべきか順にお答えください。","船舶国籍証書の交付を受けている船舶の所有者の氏名又は名称に変更があった場合の手続きを、誰が・どこに・何をすべきか順にお答えください。"],a:"①船舶所有者は ②船籍港を管轄する登記所に変更の登記を申請 ③（登記後）管海官庁に変更登録を申請 ④変更登録の申請と同時に船舶国籍証書の書換を申請 ⑤（書換後遅滞なく）書換前の証書を返還",k:["登記","変更登録","書換|書き換え|書きかえ","返還"],n:3,t:["○所有者の住所に変更があった場合、船舶所有者はまず船籍港を管轄する登記所に変更の登記を申請する。","×変更登録を申請した後、別途時期を定めて船舶国籍証書の書換を申請すればよい。｜変更登録の申請と「同時に」書換を申請する。","×船舶国籍証書の書換を受けた後、書換前の証書は次回の検認時に返還すればよい。｜書換後「遅滞なく」返還する。"]},
{s:1,y:"元,2,3,5",q:"船舶国籍証書の交付を受けている船舶が譲渡された場合の手続きを、誰が・どこに・何をすべきか順にお答えください。",a:"①新たな所有者（譲受人）は ②船籍港を管轄する登記所に所有権移転の登記を申請 ③（登記後）管海官庁に変更登録を申請 ④変更登録の申請と同時に船舶国籍証書の書換を申請 ⑤（書換後遅滞なく）書換前の証書を返還",k:["譲受人|新たな所有者|新所有者|新しい所有者|買主|買い主","移転","変更登録","書換|書き換え|書きかえ","返還"],n:3,t:["○船舶が譲渡された場合、所有権移転の登記を申請するのは新たな所有者（譲受人）である。","×船舶が譲渡された場合、譲受人は管海官庁に所有権移転の登記を申請する。｜登記の申請先は船籍港を管轄する「登記所」。"]},
{s:1,y:"元,4,6,7",q:"船舶法施行細則で規定する船舶の種類を全てお答えください。",a:"汽船（機械力で運航する装置を有するもの）\n帆船（主として帆で運航する装置を有するもの）",k:["汽船|きせん|気船","帆船|はんせん"],t:["○船舶法施行細則上の船舶の種類は、汽船と帆船である。","×船舶法施行細則上の船舶の種類は、汽船、帆船、端舟の3つである。｜汽船と帆船の2つ。"]},
{s:1,y:"元,2,3,4,7",q:"船舶法第7条で船体に標示すべき事項を、船名以外全てお答えください。",a:"船籍港／番号（船舶番号）／総トン数／喫水の尺度（その他省令で定める事項）",k:["船籍港","番号","トン数","喫水|吃水"],n:3,t:["○船体には、船名、船籍港、船舶番号、総トン数、喫水の尺度などを標示しなければならない。","×船体には、船舶所有者の氏名を標示しなければならない。｜所有者の氏名は標示事項ではない。"]},
{s:1,y:"3,4,6,7",q:"総トン数の測度や登録に関する船舶法の規定が適用されない船舶について、全てお答えください。",a:"総トン数20トン未満の船舶／端舟（推進機関及び帆装を有しない船舶）／櫓櫂のみをもって運転する舟／主として櫓櫂をもって運転する舟",k:["20トン","端舟|たんしゅう|推進機関|帆装","のみ","主として"],n:3,t:["○総トン数20トン未満の船舶には、総トン数の測度や登録に関する船舶法の規定は適用されない。","×総トン数20トン以下の船舶には、総トン数の測度や登録に関する規定は適用されない。｜「20トン未満」。","○主として櫓櫂をもって運転する舟には、総トン数の測度や登録に関する規定は適用されない。"]},
{s:1,y:"元,3,4",q:"船舶国籍証書の検認を受けなければならない期日の定め方について、全てお答えください。",a:"交付又は前回検認の日から、総トン数100トン以上の鋼製船舶は4年、100トン未満の鋼製船舶は2年、木製船舶は1年を経過した後、国土交通大臣（管海官庁）の定める期日（又は延期された期日）",k:["4年","2年","1年","鋼製|木製"],n:3,t:["○総トン数100トン以上の鋼製船舶は、交付又は前回検認の日から4年を経過した後、管海官庁の定める期日に検認を受ける。","×総トン数100トン未満の鋼製船舶は、交付又は前回検認の日から4年を経過した後に検認を受ける。｜100トン未満の鋼製船舶は2年。","×木製船舶は、交付又は前回検認の日から2年を経過した後に検認を受ける。｜木製船舶は1年。"]},
{s:1,y:"3,4,6",q:"何人でも手数料を納付することにより交付を受けられるものを、全てお答えください。",a:"総トン数計算書の謄本又は抄本\n登録事項証明書\n旧船舶原簿の謄本又は抄本",k:["計算書","登録事項","原簿"],t:["○登録事項証明書は、何人でも手数料を納付して交付を受けることができる。","×船舶件名書の謄本は、何人でも手数料を納付して交付を受けることができる。｜何人でも交付を受けられるのは、総トン数計算書の謄抄本、登録事項証明書、旧船舶原簿の謄抄本。"]},
{s:1,y:"元,3,4",q:"日本船舶を取得してから船舶国籍証書の交付を受けるまでの手続きを、誰が・どこに・何をすべきか順にお答えください。",a:"①船舶所有者は日本国内に船籍港を定め ②船籍港を管轄する管海官庁に総トン数の測度を申請 ③（船舶件名書謄本等の交付後）船籍港を管轄する登記所に所有権の保存登記を申請 ④（登記後）管海官庁に登録を申請",k:["測度","保存","登記所|登記","登録"],n:3,t:["○日本船舶を取得した船舶所有者は、まず船籍港を管轄する管海官庁に総トン数の測度を申請する。","×日本船舶を取得した場合、所有権の保存登記は管海官庁に申請する。｜保存登記は船籍港を管轄する「登記所」。","×日本船舶を取得した場合、管海官庁への登録を先に行い、その後に保存登記を行う。｜順序は 測度 → 保存登記 → 登録。"]},
{s:1,y:"3,4,5",q:"船舶法上の船籍港の定め方について、原則を全てお答えください。",a:"日本国内であること／市町村の名称によること（東京23区は東京都）／船舶が航行できる水面に接していること／所有者の住所に定めること",k:["国内","市町村","水面","住所"],n:3,t:["○船籍港は、原則として船舶所有者の住所に定める。","×東京都23区内に船籍港を定める場合は、区の名称によらなければならない。｜東京23区は「東京都」とする。","○船籍港は、船舶が航行できる水面に接した市町村でなければならない。"]},
{s:1,y:"2,3,5,6",q:"船舶に標示する船名に使用できる文字の種類について、漢字・平仮名以外を全てお答えください。",a:"片仮名／アラビア数字／ローマ字（アルファベット）／国土交通大臣の指定する記号",k:["片仮名|カタカナ","数字","ローマ字|アルファベット|英字","記号"],n:3,t:["○船名にはローマ字（アルファベット）を使用することができる。","×船名には、国土交通大臣の指定する記号であっても使用することはできない。｜大臣の指定する記号は使用できる。"]},
{s:1,y:"4,6,7",q:"船舶国籍証書の書換が必要となる場合を全てお答えください。",a:"船舶国籍証書の記載事項に変更を生じたとき\n船舶国籍証書が毀損したとき",k:["記載事項|変更","毀損|きそん|棄損|破損|損傷"],t:["○船舶国籍証書が毀損したときは、書換を申請しなければならない。","×船舶国籍証書が滅失したときは、書換を申請しなければならない。｜滅失は「再交付」。書換は記載事項の変更・毀損。"]},
{s:1,y:"元,3,7",q:"船舶国籍証書の書換又は再交付が必要となる場合を、それぞれお答えください。",a:"書換：記載事項に変更を生じた場合、毀損した場合\n再交付：滅失した場合",k:["変更|記載事項","毀損|きそん|棄損|破損","滅失|めっしつ|紛失"],t:["○船舶国籍証書が滅失した場合は、再交付を申請する。"]},
{s:1,y:"元,2,4",q:"船舶法において、申請・提出先が船籍港を管轄する管海官庁とされている手続きを全てお答えください。",a:"総トン数の測度申請／総トン数の改測申請／検認申請／船舶国籍証書の提出期日（検認）の延期申請",k:["測度","改測","検認","延期"],n:3,t:["○検認申請の申請先は、船籍港を管轄する管海官庁である。"]},
{s:1,y:"2,4,7",q:"管海官庁が総トン数の測度を行った場合に、申請者に交付しなければならないものを全てお答えください。",a:"船舶件名書の謄本\n総トン数計算書の謄本",k:["件名書","計算書"],t:["○総トン数の測度を行った場合、申請者には船舶件名書の謄本と総トン数計算書の謄本が交付される。","×総トン数の測度を行った場合、申請者には登録事項証明書が交付される。｜船舶件名書の謄本と総トン数計算書の謄本。"]},
{s:1,y:"2,3,7",q:"日本船舶が滅失・沈没したとき、及び船舶法第20条に掲げる船舶となったとき以外に、抹消登録をしなければならない場合を全てお答えください。",a:"日本の国籍を喪失したとき／解撤されたとき／船舶の存否が3箇月間不明となったとき",k:["国籍","解撤|かいてつ|解体","3か月|存否"],n:3,t:["○船舶の存否が3箇月間不明となったときは、抹消登録をしなければならない。","×船舶の存否が6箇月間不明となったときは、抹消登録をしなければならない。｜3箇月。"]},
{s:1,y:"元,6,7",q:"船舶国籍証書の検認において、提出期日の延期が認められる場合を全てお答えください。",a:"船舶が外国にある場合\nその他やむを得ない事由により証書の提出が著しく困難な場合",k:["外国|海外","やむを得ない|正当"],t:["○船舶が外国にある場合は、船舶国籍証書の提出期日の延期が認められる。"]},
{s:1,y:"3,5",q:"信号符字を点附する船舶についてお答えください。",a:"総トン数100トン以上の船舶\n総トン数100トン未満の船舶で、船舶所有者から申請のあったもの",k:["100トン","申請"],t:["○総トン数100トン未満の船舶でも、船舶所有者から申請があれば信号符字が点附される。","×信号符字は、総トン数20トン以上の全ての船舶に点附される。｜100トン以上の船舶と、100トン未満で申請のあったもの。"]},
{s:1,y:"2,5",q:"総トン数の測度の申請があった場合、管海官庁が必要と認めるときに提出を求めることができる書面は、何を証する書面ですか。4つお答えください。",a:"造船地／造船者／進水の年月／船舶の原名",k:["造船地","造船者","進水","原名|もとの名"],n:3,t:["○管海官庁は、測度の申請について必要と認めるときは、進水の年月を証する書面の提出を求めることができる。"]},
{s:1,y:"2,5",q:"仮船舶国籍証書の有効期間の定め方について、全てお答えください。",a:"外国で交付する場合：1年以内\n国内で交付する場合：6箇月以内\n船籍港に到着できる期間又は国籍証書の交付を受けられる期間を標準として管海官庁が定める（船籍港に到着したときは満了前でも効力を失う）",k:["1年","6か月|半年"],t:["○外国で交付を受ける仮船舶国籍証書の有効期間は、最長1年である。","×国内で交付される仮船舶国籍証書の有効期間は、1年以内である。｜国内は6箇月以内。","×仮船舶国籍証書は、船舶が船籍港に到着しても有効期間の満了までは効力を失わない。｜船籍港に到着したときは満了前でも効力を失う。"]},
{s:1,y:"2,6",q:"船舶国籍証書を管海官庁に返還しなければならない場合を全てお答えください。",a:"船舶の登録を抹消した場合／書換により新証書の交付を受けた場合／（外国で毀損・記載事項変更により）仮船舶国籍証書の交付を受けた場合",k:["抹消","書換|書き換え|新しい証書|新証書","仮"],n:3,t:["○船舶の登録を抹消した場合は、船舶国籍証書を管海官庁に返還しなければならない。"]},
{s:1,y:"元,6",q:"日本船舶が、船舶国籍証書又は仮船舶国籍証書の交付を受けた後でなければ行ってはいけないことを全てお答えください。",a:"日本の国旗を掲げること\n船舶を航行させること",k:["国旗","航行"],t:["○日本船舶は、原則として船舶国籍証書又は仮船舶国籍証書の交付を受けた後でなければ、日本の国旗を掲げることができない。"]},

{s:2,y:"元",q:"日本国民がSTCW条約の締約国以外の国を旗国とする15万トンのタンカーを船舶のみ借り入れた場合、船舶所有者たる日本国民は、乗組み基準に従い海技士を乗り組ませる必要がありますか。理由もお答えください。",a:"必要がある。\n法の「船舶」には、日本国民が借り入れた日本船舶以外の船舶（外国船）が含まれるため。",k:["必要がある|必要です|必要あり|あります","借り入|外国"],t:["○日本国民がSTCW条約締約国以外の国を旗国とする外国船を船舶のみ借り入れた場合、法の乗組み基準に従う必要がある。"]},

{s:3,y:"元,2,3,4,5",q:"国際航海に従事する貨物船が、船舶検査証書の有効期間満了時に外国の港から本邦の港等に向けて航海中となる場合、申請により、証書は有効期間満了後何ヶ月まで効力を有しますか。",a:"3ヶ月",k:["3"],t:["○外国から本邦に向け航海中に有効期間が満了する国際航海の貨物船の船舶検査証書は、申請により満了後3ヶ月まで効力を有する。","×その場合、船舶検査証書は満了後6ヶ月まで効力を有する。｜3ヶ月。"]},
{s:3,y:"元,2,4,5",q:"航行区域が沿海区域の船舶について、満載喫水線の標示が義務づけられているのはどのような船舶ですか。",a:"長さ24メートル以上の船舶",k:["24"],t:["○沿海区域を航行区域とする長さ24メートル以上の船舶は、満載喫水線を標示しなければならない。","×沿海区域を航行区域とする船舶は、長さにかかわらず全て満載喫水線を標示しなければならない。｜長さ24メートル以上。全船舶が対象なのは遠洋・近海区域。"]},
{s:3,y:"元,2,3,4,7",q:"平水区域を航行区域とする総トン数200トンの旅客船の船舶検査証書の有効期間は何年ですか。",v:["平水区域を航行区域とする総トン数200トンの旅客船の船舶検査証書の有効期間は何年ですか。","沿海区域を航行区域とする総トン数200トンの旅客船の船舶検査証書の有効期間は何年ですか。","沿海区域を航行区域とする総トン数19トンの旅客船の船舶検査証書の有効期間は何年ですか。","平水区域を航行区域とし、総トン数24トン、旅客定員13人の船舶の船舶検査証書の有効期間は何年ですか。"],a:"5年（旅客船は航行区域にかかわらず5年）",k:["5年"],t:["○平水区域を航行区域とする旅客船の船舶検査証書の有効期間は5年である。","×平水区域を航行区域とする旅客船の船舶検査証書の有効期間は6年である。｜旅客船は5年。6年は旅客船を除く平水区域の船舶。"]},
{s:3,y:"元,4,5,7",q:"平水区域を航行区域とする総トン数200トンの貨物船の船舶検査証書の有効期間は何年ですか。",v:["平水区域を航行区域とする総トン数200トンの貨物船の船舶検査証書の有効期間は何年ですか。","平水区域を航行区域とし、総トン数24トン、旅客定員12人の船舶の船舶検査証書の有効期間は何年ですか。"],a:"6年（旅客船を除く平水区域の船舶）",k:["6年"],t:["○平水区域を航行区域とする総トン数200トンの貨物船の船舶検査証書の有効期間は6年である。","○旅客定員12人の船舶は旅客船に当たらないため、平水区域を航行区域とする場合の船舶検査証書の有効期間は6年である。"]},

{s:3,y:"3,4,6",q:"総トン数20トン以上の船舶について、最初の定期検査に合格した場合に船舶所有者に交付されるものを全てお答えください。",a:"船舶検査証書\n船舶検査手帳",k:["証書","手帳"],t:["○総トン数20トン以上の船舶が最初の定期検査に合格すると、船舶検査証書と船舶検査手帳が交付される。"]},

<script>

const ylabel=it=>it.y.split(",").map(x=>x==="元"?"R元":"R"+x).join("・");
BANK.forEach((it,i)=>{it.id=i;it.n=it.n||it.k.length});
const store={get(k,d){try{const v=localStorage.getItem("kaiji_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("kaiji_"+k,JSON.stringify(v))}catch(e){}}};
const S=Object.assign({mode:"oral",judge:true,showText:true,weighted:true,subjects:[0,1,2,3],voice:"",
  oxJudge:true,oxSubject:0,oxOrder:"imp",oxCount:20},store.get("settings",{}));
const save=()=>store.set("settings",S);

// 文字の正規化（全角半角・カナ・漢数字・か月表記をそろえる）
function kanjiNum(s){
  const D={"〇":0,"零":0,"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
  const U={"十":10,"百":100,"千":1000};
  return s.replace(/[0-9〇零一二三四五六七八九十百千]+/g,m=>{
    if(/^[0-9]+$/.test(m))return m;
    let total=0,cur=0,any=false;
    for(const c of m){
      if(c>="0"&&c<="9"){cur=cur*10+(+c);any=true}
      else if(c in D){cur=cur*10+D[c];any=true}
      else{total+=(cur||1)*U[c];cur=0;any=true}
    }
    return any?String(total+cur):m;
  });
}
function norm(s){
  s=String(s).normalize("NFKC").toLowerCase();
  s=s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  s=s.replace(/[\s、。，．・,.「」『』（）()！？!?\-ー～〜:：;；]/g,"");
  s=kanjiNum(s);
  s=s.replace(/箇月|ヶ月|ヵ月|ゖ月|ゕ月|か月|け月|カ月/g,"か月").replace(/([0-9])月/g,"$1か月");
  return s;
}
function grade(it,text){
  const t=norm(text);
  const hits=it.k.map(g=>g.split("|").some(w=>{const n=norm(w);return n&&t.includes(n)}));
  const c=hits.filter(Boolean).length;
  const r=c>=it.n?"ok":c>0?"part":"ng";
  return {r,hits};
}
const VERD={ok:"言えた",part:"一部言えた",ng:"言えなかった",skip:"パス・時間切れ",none:"無回答"};

// ───── 音声合成（男性・普通の速さ） ─────
let voices=[];
function loadVoices(){voices=(speechSynthesis.getVoices()||[]).filter(v=>/^ja/i.test(v.lang))}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(view==="home")renderHome()}}
const MALE=/otoya|ichiro|keita|hattori|daichi|naoki|takumi|kenji|male|男性|男/i;
function pickVoice(){
  if(S.voice){const v=voices.find(v=>v.voiceURI===S.voice);if(v)return v}
  return voices.find(v=>MALE.test(v.name))||null;
}
function speak(text){
  return new Promise(res=>{
    if(!("speechSynthesis" in window)){setTimeout(res,300);return}
    let done=false,guard=null,watch=null;
    const fin=()=>{if(done)return;done=true;clearTimeout(guard);clearInterval(watch);if(current.speakFin===fin)current.speakFin=null;res()};
    current.speakFin=fin;
    try{speechSynthesis.cancel()}catch(e){}
    // 止めた直後に話させると無音で終わらない端末があるので少し待つ
    setTimeout(()=>{
      if(done)return;
      const u=new SpeechSynthesisUtterance(text);
      u.lang="ja-JP";u.rate=1.0;
      const v=pickVoice();
      if(v){u.voice=v;u.pitch=MALE.test(v.name)?1:0.7}else u.pitch=0.7; // 男性音声がない端末は声を低めにする
      u.onend=fin;u.onerror=fin;
      guard=setTimeout(fin,3000+text.length*220);
      let started=Date.now();
      // 読み上げが始まらない・終わったのに知らせが来ない場合の見張り
      watch=setInterval(()=>{if(Date.now()-started>1500&&!speechSynthesis.speaking&&!speechSynthesis.pending)fin()},400);
      try{speechSynthesis.speak(u)}catch(e){fin()}
    },120);
  });
}
function skipSpeak(){try{speechSynthesis.cancel()}catch(e){}if(current.speakFin)current.speakFin()}
const sayText=q=>q.replace(/【[^】]*】/g,"").replace(/第(\d+)条の(\d+)/g,"第$1条の$2");

// ───── 音声認識 ─────
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBroken=false;
function listen(ms,ui){
  // ui: {tick(sec,left), text(final,interim)}  → resolves {type:"answer"|"pass"|"timeout", text}
  return new Promise(resolve=>{
    let final="",interim="",finished=false,rec=null,silence=null;
    const start=Date.now();
    const finish=type=>{
      if(finished)return;finished=true;
      clearInterval(tm);clearTimeout(silence);
      try{rec&&rec.abort()}catch(e){}
      if(current.listen===handle)current.listen=null;
      const t=(final+interim).trim();
      if(type==="timeout"&&t)type="answer";
      resolve({type,text:t});
    };
    const handle={finish};current.listen=handle;
    const tm=setInterval(()=>{const left=Math.max(0,ms-(Date.now()-start));ui.tick(left);if(left<=0)finish("timeout")},100);
    const isPass=s=>{const n=norm(s);return /^(ぱす|ぱすします|ぱすで|ぱすです|ぱすでお願いします|ぱすおねがいします|bus|pass|パス)$/.test(n)||(/^ぱす/.test(n)&&n.length<=6)};
    if(!SR||micBroken){ui.fallback&&ui.fallback(v=>{final=v;finish(isPass(v)?"pass":"answer")});return}
    const boot=()=>{
      if(finished)return;
      rec=new SR();rec.lang="ja-JP";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
      rec.onresult=e=>{
        interim="";
        for(let i=e.resultIndex;i<e.results.length;i++){
          const r=e.results[i];
          if(r.isFinal)final+=r[0].transcript;else interim+=r[0].transcript;
        }
        ui.text(final,interim);
        if(ui.check){if(ui.check(final+interim)){finish("answer")}return}
        if(isPass(final+interim)){finish("pass");return}
        if(/以上です$|以上$/.test(final.trim())){final=final.replace(/以上です?$/,"");finish("answer");return}
        clearTimeout(silence);
        if((final+interim).trim())silence=setTimeout(()=>finish("answer"),2200);
      };
      rec.onerror=e=>{
        if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"){
          micBroken=true;ui.error&&ui.error(e.error);ui.fallback&&ui.fallback(v=>{final=v;finish(isPass(v)?"pass":"answer")});
        }
      };
      rec.onend=()=>{if(!finished&&!micBroken)setTimeout(boot,120)};
      try{rec.start()}catch(e){setTimeout(boot,300)}
    };
    boot();
  });
}

  $("#tab-oral").onclick=()=>{S.mode="oral";save();renderHome()};

function pick5(s){
  const pool=BANK.filter(b=>b.s===s).map(b=>({b,w:S.weighted?ycount(b):1}));
  const out=[];
  while(out.length<5&&pool.length){
    const sum=pool.reduce((a,p)=>a+p.w,0);let r=Math.random()*sum,i=0;
    for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break}
    const p=pool.splice(Math.min(i,pool.length-1),1)[0].b;
    const q=p.v?p.v[Math.floor(Math.random()*p.v.length)]:p.q;
    out.push({it:p,q,status:"wait",text:"",r:null,hits:null});
  }
  return out;

function startExam(){

async function runSubject(){
  stopAll();const g=gen;
  const E=current.exam;
  const s=E.subjects[E.si];
  const qs=pick5(s);
  const R={s,qs,left:180};
  E.results.push(R);
  let paused=false,over=false;
  const tickClock=()=>{
    const el=$("#clock"),bar=$("#bar");
    if(el){el.textContent=`${Math.floor(R.left/60)}:${String(Math.floor(R.left%60)).padStart(2,"0")}`;el.classList.toggle("low",R.left<=30)}
    if(bar)bar.style.width=(R.left/180*100)+"%";
  };
  renderExamShell(R,null);
  await speak(`${SUBJECTS[s]}の試験を始めます。`);
  if(g!==gen)return;
  let last=Date.now();
  const myTimer=current.timer=setInterval(()=>{
    const now=Date.now();if(!paused&&!over){R.left=Math.max(0,R.left-(now-last)/1000)}last=now;tickClock();
    if(g!==gen){clearInterval(myTimer);return}
    if(R.left<=0&&!over){over=true;stopAll();timeUp()}
  },200);
  const ask=async qi=>{
    const Q=qs[qi];Q.status="cur";current.pending=null;renderExamShell(R,qi);
    await speak(sayText(Q.q));
    if(over||g!==gen)return "over";
    if(current.pending==="pass"){current.pending=null;Q.status="pass";Q.text="";return "pass"}
    current.pending=null;
    setMic("listening");
    const res=await listen(10000,{
      tick:left=>{const n=$("#ringn"),c=$("#ringc");if(n)n.textContent=Math.ceil(left/1000);if(c)c.style.strokeDashoffset=(1-left/10000)*226},
      text:(f,i)=>{const h=$("#heard");if(h)h.innerHTML=esc(f)+`<span class="interim">${esc(i)}</span>`},
      error:err=>{const st=$("#status");if(st)st.textContent="マイクが使えません。文字で回答してください";},
      fallback:cb=>{const f=$("#fb");if(f){f.hidden=false;const inp=$("#fbin");inp.value="";inp.focus();$("#fbform").onsubmit=e=>{e.preventDefault();cb(inp.value)}}}
    });
    if(over||g!==gen||res.type==="abort")return "over";
    if(res.type==="pass"){Q.status="pass";Q.text="";return "pass"}
    Q.text=res.text||"";const gr=grade(Q.it,Q.text);Q.hits=gr.hits;Q.r=Q.text?gr.r:"ng";Q.status="done";
    if(S.judge){paused=true;await showVerdict(R,qi);if(g!==gen)return "over";paused=false;last=Date.now()}
    return "done";
  };
  // 1巡目
  for(let i=0;i<qs.length;i++){const r=await ask(i);if(r==="over")return}
  // パスした問題へ戻る（時間がある限り）
  while(!over){
    const pend=qs.map((q,i)=>q.status==="pass"?i:-1).filter(i=>i>=0);
    if(!pend.length)break;
    await speak("パスした問題に戻ります。");if(over||g!==gen)return;
    for(const i of pend){const r=await ask(i);if(r==="over")return}
    if(qs.every(q=>q.status!=="pass"))break;
  }
  if(over||g!==gen)return;
  over=true;clearInterval(myTimer);current.timer=null;
  await speak(`${SUBJECTS[s]}の試験を終わります。`);
  subjectEnd(false);
}

  const wrong=done.filter(q=>q.r!=="ok");
  $("#oxretry").disabled=!wrong.length;
  $("#oxretry").onclick=()=>{current.ox={items:wrong.map(x=>Object.assign({},x,{text:"",r:null,hits:null,status:"wait"})),i:0,round:1};renderOx()};
  $("#home").onclick=renderHome;
}
function renderOxList(){
  stopAll();view="oxlist";
  const items=sortImp(drillPool(S.oxSubject));
  app.innerHTML=`
  <div class="row between"><div><div class="eyebrow">重要論点順 一覧</div><h2>${S.oxSubject<0?"全科目":SUBJECTS[S.oxSubject]}（${items.length}問）</h2></div><button class="btn ghost" id="home">戻る</button></div>
  <div class="row"><span class="small muted">模範解答を</span><button class="chip" id="hide" aria-pressed="false">隠す</button></div>
  <div class="res">${items.map(x=>`<div class="ritem">
    <div class="yr">${SHORT[x.it.s]}・出題 ${ylabel(x.it)}（${x.imp}回）</div>
    <div class="q">${esc(x.q)}</div>
    <div class="ansline"><div class="small" style="margin-top:6px;color:var(--brass);font-weight:700">模範解答</div><p class="model">${esc(x.it.a)}</p></div></div>`).join("")}</div>`;
  $("#home").onclick=renderHome;
  $("#hide").onclick=e=>{const on=e.target.getAttribute("aria-pressed")!=="true";e.target.setAttribute("aria-pressed",on);document.querySelectorAll(".ansline").forEach(d=>d.style.visibility=on?"hidden":"visible")};
}

try{const wl=navigator.wakeLock&&navigator.wakeLock.request("screen");wl&&wl.catch(()=>{})}catch(e){}
renderHome();
</script>
