<style>
/* 荒野の劇画：夕焼けの荒野キャンバスの上に、縦スクロールの1画面ゲーム。単一の暗いルック。 */
:root{
  --ink:#120c0a; --panel:rgba(18,12,10,.86); --bone:#efe3cf; --dust:#c98a4b;
  --blood:#c22d22; --gold:#d9a441; --steel:#7f8a96; --ok:#5fae6a; --sil:#0b0807;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font-family:var(--body);font-size:15px;line-height:1.7;overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.75) 100%)}
#app{position:relative;z-index:2;height:100%;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.screen{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font-family:var(--body);cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--blood);color:var(--bone);border:3px solid var(--bone);font-weight:900;font-size:17px;padding:12px 18px;letter-spacing:.08em;box-shadow:5px 5px 0 var(--sil);transition:transform .1s}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--sil)}
.btn.ghost{background:transparent;box-shadow:none;border-width:2px;font-size:14px}
.mute.backbtn{right:auto;left:calc(10px + env(safe-area-inset-left,0px))}
.mute.voicebtn{right:calc(82px + env(safe-area-inset-right,0px))}
.mute{position:fixed;z-index:30;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:calc(10px + env(safe-area-inset-right,0px));background:var(--panel);color:var(--bone);border:1px solid var(--dust);font-size:12px;padding:4px 10px}

/* タイトル */
#s-title{min-height:calc(100% - 20px);justify-content:center;text-align:center;padding-top:20px}
.logo{font-family:var(--display);font-size:clamp(44px,13vw,64px);line-height:.95;letter-spacing:.02em;color:var(--bone);text-shadow:4px 4px 0 var(--blood),8px 8px 0 var(--sil);transform:skewY(-4deg);margin:0}
.logo .pre{display:inline-block;font-family:var(--body);font-weight:900;font-size:.3em;letter-spacing:.45em;padding:2px 4px 2px 14px;margin-bottom:10px;color:var(--bone);background:var(--blood);text-shadow:none;border:2px solid var(--bone)}
.logo small{display:block;font-size:.55em;margin-top:10px;color:var(--gold);text-shadow:3px 3px 0 var(--sil)}
.title-hero{width:min(130px,12vh);margin:6px auto 0;filter:drop-shadow(0 0 18px rgba(217,130,47,.5))}
.tagline{font-weight:900;font-size:17px;background:var(--sil);border-left:6px solid var(--blood);padding:10px 14px;text-align:left}
.note{font-size:12px;color:var(--dust);margin:0}

/* 章見出し */
.chap{font-family:var(--display);font-size:22px;letter-spacing:.06em;margin:0;text-shadow:3px 3px 0 var(--sil);border-bottom:3px solid var(--blood);padding-bottom:4px}
.chap span{display:block;font-family:var(--body);font-size:12px;color:var(--gold);letter-spacing:.2em;font-weight:700}

/* 4コマ */
.koma{display:flex;flex-direction:column;gap:10px}
.panel{position:relative;height:190px;border:3px solid var(--bone);overflow:hidden;background:linear-gradient(180deg,#3a140c 0%,#8f3e1a 55%,#d58a3a 78%,#4a2414 79%,#1d0e09 100%);box-shadow:5px 5px 0 var(--sil);animation:panelIn .45s ease-out both}
.panel.bg-dark{background:linear-gradient(180deg,#0e0807 0%,#2a120c 70%,#3d1c10 78%,#140906 79%)}
.panel.bg-red{background:linear-gradient(180deg,#4a0705 0%,#a01d12 60%,#e0602a 78%,#3a1209 79%,#140906 100%)}
@keyframes panelIn{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
.tone{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.35) 1.1px,transparent 1.3px);background-size:6px 6px;mix-blend-mode:multiply}
.panel.lines::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,240,220,.22) 0deg 1.2deg,transparent 1.2deg 7deg);-webkit-mask:radial-gradient(circle at 50% 50%,transparent 18%,#000 42%);mask:radial-gradient(circle at 50% 50%,transparent 18%,#000 42%);z-index:1}
.fig{position:absolute;bottom:-4px;height:84%;aspect-ratio:100/160;z-index:2}
.fig svg{width:100%;height:100%;display:block}
.fig.l{left:5%}.fig.r{right:5%}.fig.c{left:50%;transform:translateX(-50%)}
.fig.boss,.fig.kurosaki{height:100%}
.fig.girl{height:66%}
.fig.dogra{height:94%}
.fig.inn{height:86%}
.nar{position:absolute;top:0;left:0;max-width:66%;background:var(--sil);color:var(--bone);font-size:12px;line-height:1.55;padding:6px 9px;z-index:4;border-right:2px solid var(--bone);border-bottom:2px solid var(--bone)}
.say{position:absolute;z-index:5;bottom:30%;max-width:52%;background:#fbf6ec;color:#120c0a;font-weight:700;font-size:12.5px;line-height:1.5;padding:7px 11px;border:2.5px solid #120c0a;border-radius:18px}
.say.l{left:30%}.say.r{right:30%}.say.c{left:50%;transform:translateX(-50%);bottom:auto;top:44%}
.say.evil{border-color:var(--blood);box-shadow:0 0 0 2px #fbf6ec,0 0 0 4px var(--blood);font-weight:900}
.ntag{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;background:rgba(10,6,4,.88);color:#fbf6ec;font-size:11px;font-weight:900;line-height:1;padding:4px 7px 4px 6px;border-left:3px solid var(--blood);white-space:nowrap;letter-spacing:.06em}
.fig.hero .ntag{border-left-color:var(--gold)}
.say .who{display:block;font-size:10px;color:var(--blood);letter-spacing:.1em;margin-bottom:1px}
.fig.l.down{animation:none!important;transform-origin:50% 100%;transform:translate(-10px,18px) rotate(-82deg);transition:transform 1.3s cubic-bezier(.55,0,.85,.6)}
body.wasted #app,body.wasted #sky{filter:grayscale(1) contrast(1.15) brightness(.8);transition:filter 1.5s}
body.wasted .stage{transform:scale(1.1);transition:transform 3s ease-out}
#ov.dead{background:rgba(0,0,0,.25)}
.wasted-box{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.wasted-band{width:100vw;background:linear-gradient(90deg,transparent,rgba(0,0,0,.75) 20%,rgba(0,0,0,.75) 80%,transparent);padding-block:14px}
.wasted-txt{font-family:var(--display);font-size:clamp(54px,16vw,100px);letter-spacing:.12em;color:#c22d22;-webkit-text-stroke:2.5px #000;text-shadow:4px 4px 0 #000;animation:wst .9s cubic-bezier(.2,.8,.3,1) both}
@keyframes wst{0%{opacity:0;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}
.fig.r.laughing{animation:laughA .28s ease-in-out infinite}
@keyframes laughA{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.laugh{position:absolute;z-index:7;right:4%;top:6%;font-family:var(--display);font-size:clamp(18px,5.5vw,26px);color:#fbf6ec;-webkit-text-stroke:1.4px #0b0807;text-shadow:3px 3px 0 var(--blood);transform:rotate(8deg);animation:laughT .5s ease-out both,laughS .3s .5s infinite;white-space:nowrap;pointer-events:none}
@keyframes laughT{0%{opacity:0;transform:rotate(8deg) scale(.4)}100%{opacity:1;transform:rotate(8deg) scale(1)}}
@keyframes laughS{0%,100%{transform:rotate(8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-3px)}}
.wasted-laugh{margin:0;font-weight:900;color:#c22d22;font-size:clamp(16px,4.6vw,22px);text-shadow:0 2px 0 #000;animation:wst 1s .2s both}
.wasted-sub{margin:0;color:#e8e2d6;font-weight:900;letter-spacing:.15em;text-shadow:0 2px 0 #000;animation:wst 1.2s .4s both}
.pno{position:absolute;bottom:4px;right:6px;z-index:5;font-family:var(--display);font-size:11px;color:var(--bone);opacity:.6}

/* HUD・バトル */
.hud{background:var(--panel);border:2px solid var(--dust);padding:8px 12px;display:grid;gap:6px}
.bar{display:grid;grid-template-columns:7.5em 1fr 3em;align-items:center;gap:8px;font-size:12px;font-weight:700}
.lives{display:flex;gap:5px}
.lives i{flex:1;height:14px;background:#2a1a14;border:1px solid var(--dust);transform:skewX(-12deg)}
.lives i.on{background:linear-gradient(180deg,#ff7a5a,var(--blood));box-shadow:0 0 8px rgba(194,45,34,.7)}
.lives i.lost{animation:lost .6s}
@keyframes lost{0%,40%{background:#fff}100%{background:#2a1a14}}
.bar.me span{color:var(--gold)}
.bar .track{height:10px;background:#2a1a14;border:1px solid var(--dust);overflow:hidden}
.bar .fill{height:100%;background:var(--ok);transition:width .5s}
.bar.enemy .fill{background:var(--blood)}
.bar b{font-variant-numeric:tabular-nums;text-align:right}
.arena{position:sticky;top:-14px;z-index:8;display:flex;flex-direction:column;gap:8px;background:var(--ink);margin-inline:-6px;padding:6px 6px 8px;box-shadow:0 10px 16px -8px rgba(0,0,0,.9)}
.arena .hud{padding:6px 10px;gap:4px}
.stage{position:relative;height:clamp(140px,24vh,200px);border:3px solid var(--bone);overflow:hidden;background:linear-gradient(180deg,#2a0f0a 0%,#8a3b1c 62%,#c97a32 74%,#3a1a10 75%,#140906 100%)}
.stage .tone{opacity:.7}
.stage .fig{height:80%}
.stage .fig.r.boss,.stage .fig.r.bigboss{height:98%}
.stage .enemyname{position:absolute;top:8px;right:10px;z-index:4;font-family:var(--display);font-size:15px;text-shadow:2px 2px 0 var(--sil)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}
.fig.hit{animation:hitf .45s}
@keyframes hitf{0%{filter:none}30%{filter:brightness(3) drop-shadow(0 0 10px #fff)}100%{filter:none}}
.fig.ko{animation:ko 1s forwards}
@keyframes ko{to{transform:translate(160px,-140px) rotate(60deg);opacity:0}}
.pow{position:absolute;z-index:6;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-8deg);font-family:var(--display);font-size:40px;color:var(--gold);text-shadow:3px 3px 0 var(--blood),6px 6px 0 var(--sil);animation:pow .7s forwards;pointer-events:none;white-space:nowrap}
@keyframes pow{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2) rotate(-8deg);opacity:1}100%{transform:translate(-50%,-70%) scale(1) rotate(-8deg);opacity:0}}
.scream{position:absolute;z-index:7;right:8%;top:14%;font-family:var(--display);font-size:26px;color:#fbf6ec;-webkit-text-stroke:1.5px var(--sil);text-shadow:3px 3px 0 var(--blood);transform:rotate(10deg);animation:scr 1.1s forwards;pointer-events:none;white-space:nowrap}
@keyframes scr{0%{opacity:0;transform:rotate(10deg) scale(.5)}15%{opacity:1;transform:rotate(10deg) scale(1.15) translateX(-3px)}25%{transform:rotate(10deg) scale(1) translateX(3px)}35%{transform:rotate(10deg) translateX(-2px)}80%{opacity:1}100%{opacity:0;transform:rotate(10deg) translateY(-14px)}}
.kiai{position:absolute;z-index:7;left:6%;top:10%;font-family:var(--display);font-size:28px;color:var(--gold);-webkit-text-stroke:1.5px var(--sil);text-shadow:3px 3px 0 var(--sil);transform:rotate(-10deg);animation:kiaiA 1s forwards;pointer-events:none;white-space:nowrap}
@keyframes kiaiA{0%{opacity:0;transform:rotate(-10deg) scale(.4)}18%{opacity:1;transform:rotate(-10deg) scale(1.2)}30%{transform:rotate(-10deg) scale(1)}80%{opacity:1}100%{opacity:0}}
.fig.l.lunge{animation:lunge .8s}
@keyframes lunge{0%{transform:none}40%{transform:translateX(90px) scale(1.08)}65%{transform:translateX(90px) scale(1.08)}100%{transform:none}}
.fig.l.kickmove{animation:kickm .8s}
@keyframes kickm{0%{transform:none}35%{transform:translate(80px,-26px) rotate(-12deg)}65%{transform:translate(90px,-10px) rotate(-6deg)}100%{transform:none}}
.fig.l.grabbing{animation:grabm 1.7s}
@keyframes grabm{0%{transform:none}18%{transform:translateX(var(--gx,120px))}25%,70%{transform:translate(var(--gx,120px),26px) rotate(18deg)}100%{transform:none}}
.fig.r.pinned{animation:pin 1s}
@keyframes pin{0%{transform:none}25%{transform:translate(10px,40px) rotate(78deg)}30%,85%{transform:translate(12px,42px) rotate(80deg)}40%{transform:translate(14px,42px) rotate(82deg)}50%{transform:translate(10px,42px) rotate(78deg)}60%{transform:translate(14px,42px) rotate(82deg)}100%{transform:translate(12px,42px) rotate(80deg)}}
.fig.r.knockkick{animation:kk 1.1s cubic-bezier(.2,.9,.3,1)}
@keyframes kk{0%{transform:none;filter:brightness(3)}15%{transform:translate(20px,-30px) rotate(-30deg);filter:none}45%{transform:translate(70px,-90px) rotate(-200deg)}70%{transform:translate(85px,-10px) rotate(-340deg)}100%{transform:none}}
.book{position:absolute;left:0;top:0;z-index:6;width:54px;height:66px;pointer-events:none;transform-origin:50% 90%;filter:drop-shadow(3px 3px 0 #0b0807)}
.book svg{width:100%;height:100%;display:block}
.leg{position:absolute;left:0;top:0;z-index:6;width:96px;height:34px;pointer-events:none;transform-origin:0 50%}
.leg svg{width:100%;height:100%;display:block}
.squeeze{position:absolute;z-index:7;right:12%;top:30%;font-family:var(--display);font-size:20px;color:#fbf6ec;-webkit-text-stroke:1.2px #0b0807;text-shadow:2px 2px 0 var(--blood);transform:rotate(-6deg);animation:sq .9s steps(6) forwards;pointer-events:none;white-space:nowrap}
@keyframes sq{0%{opacity:0}10%{opacity:1}50%{transform:rotate(-6deg) translateX(2px)}100%{opacity:1;transform:rotate(-6deg) translateX(-2px)}}
.fist{position:absolute;left:0;top:0;z-index:6;width:70px;height:40px;pointer-events:none}
.fist::before{content:"";position:absolute;right:62px;top:6px;width:70px;height:28px;background:repeating-linear-gradient(180deg,rgba(255,240,220,.85) 0 2px,transparent 2px 7px);-webkit-mask:linear-gradient(90deg,transparent,#000);mask:linear-gradient(90deg,transparent,#000)}
.fist svg{width:100%;height:100%;display:block}
.boom{position:absolute;z-index:7;width:110px;height:110px;transform:translate(-50%,-50%);pointer-events:none;animation:boomA .7s forwards}
.boom svg{width:100%;height:100%}
.boom.mini{width:56px;height:56px;animation-duration:.35s}
.boom span{position:absolute;left:50%;top:-6px;transform:translateX(-50%) rotate(-12deg);font-family:var(--display);font-size:22px;color:#fbf6ec;-webkit-text-stroke:1.5px #0b0807;text-shadow:2px 2px 0 var(--blood);white-space:nowrap}
@keyframes boomA{0%{transform:translate(-50%,-50%) scale(.2) rotate(0)}25%{transform:translate(-50%,-50%) scale(1.15) rotate(12deg)}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.3) rotate(20deg);opacity:0}}
.fig.r.knock{animation:knock 1s cubic-bezier(.2,.9,.3,1)}
@keyframes knock{0%{transform:none;filter:brightness(3)}12%{transform:translate(14px,-8px) rotate(10deg);filter:brightness(2)}40%{transform:translate(80px,-46px) rotate(40deg);filter:none}62%{transform:translate(90px,-8px) rotate(62deg)}75%{transform:translate(84px,0) rotate(55deg)}100%{transform:none}}
.stage.impact::after{content:"";position:absolute;inset:0;z-index:5;background:#fff;opacity:0;animation:imp .25s;pointer-events:none}
@keyframes imp{0%{opacity:.7}100%{opacity:0}}
.redflash{position:fixed;inset:0;z-index:40;background:var(--blood);opacity:0;pointer-events:none}
.redflash.on{animation:rf .5s}
@keyframes rf{0%{opacity:.5}100%{opacity:0}}

.card{background:var(--panel);border:2px solid var(--bone);padding:14px;display:flex;flex-direction:column;gap:10px}
.qtag{align-self:flex-start;font-size:11px;font-weight:900;letter-spacing:.15em;background:var(--blood);padding:2px 10px}
.qtext{font-weight:700;font-size:15.5px;margin:0}
.opts{display:grid;gap:8px}
.opts.ox{grid-template-columns:1fr 1fr}
.opt{background:#22150f;color:var(--bone);border:2px solid var(--dust);padding:10px 12px;text-align:left;font-size:14px;font-weight:700;line-height:1.5}
.opts.ox .opt{text-align:center;font-family:var(--display);font-size:30px;padding:6px}
.opt:hover:not(:disabled){border-color:var(--gold);background:#2e1c13}
.opt.right{border-color:var(--ok);background:#1b2e1d}
.opt.wrong{border-color:var(--blood);background:#3a110d}
.opt:disabled{cursor:default}
.fb{border-top:2px dashed var(--dust);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.fb .verdict{font-family:var(--display);font-size:20px}
.fb .verdict.ok{color:var(--ok)}.fb .verdict.ng{color:var(--blood)}
.fb p{margin:0;font-size:14px}
.law{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.08em}

/* ボス記述 */
textarea{width:100%;min-height:96px;resize:vertical;background:#fbf6ec;color:#120c0a;border:3px solid var(--sil);font-family:var(--body);font-size:15px;font-weight:700;line-height:1.6;padding:10px;box-sizing:border-box}
.count{font-size:12px;color:var(--dust);text-align:right;font-variant-numeric:tabular-nums}
.gauge{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:6px}
.orb{border:2px solid var(--steel);background:#1a120e;color:var(--steel);font-size:11px;font-weight:900;text-align:center;padding:6px 2px;line-height:1.3;transition:all .25s}
.orb.on{border-color:var(--gold);color:#120c0a;background:var(--gold);box-shadow:0 0 14px rgba(217,164,65,.7)}
.meter{height:12px;background:#1a120e;border:2px solid var(--bone);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blood),var(--gold));transition:width .3s}
.hints{margin:0;padding-left:1.2em;font-size:13px;color:var(--dust)}
.model{background:#22150f;border-left:4px solid var(--gold);padding:8px 10px;font-size:14px;font-weight:700}

/* オーバーレイ：決めゴマ・奥義 */
#ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));background:rgba(5,3,2,.9)}
.kime{position:relative;width:100%;max-width:440px;border:4px solid var(--bone);background:linear-gradient(180deg,#5a1209,#160806);overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px 18px;box-sizing:border-box}
.kime::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 40%,rgba(255,230,200,.18) 0deg 1.4deg,transparent 1.4deg 6deg);-webkit-mask:radial-gradient(circle at 50% 40%,transparent 14%,#000 40%);mask:radial-gradient(circle at 50% 40%,transparent 14%,#000 40%)}
.kime>*{position:relative}
.face{width:170px;height:170px}
.face svg{width:100%;height:100%}
.kime-line{font-weight:900;font-size:16px;background:#fbf6ec;color:#120c0a;border:3px solid #120c0a;border-radius:20px;padding:10px 14px;text-align:center}
.stamp{font-family:var(--display);font-size:30px;color:var(--bone);background:var(--blood);border:4px double var(--bone);padding:4px 16px;transform:rotate(-6deg);animation:stamp .5s .35s both;text-shadow:2px 2px 0 var(--sil)}
@keyframes stamp{0%{transform:rotate(-6deg) scale(3);opacity:0}70%{transform:rotate(-6deg) scale(.92);opacity:1}100%{transform:rotate(-6deg) scale(1)}}
.glint{animation:glint 2.6s infinite}
@keyframes glint{0%,70%{opacity:0}78%{opacity:1}90%,100%{opacity:0}}
.finisher{width:100%;max-width:460px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.ougi{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:80px}
.ougi span{font-family:var(--display);font-size:clamp(40px,12vw,62px);color:var(--bone);text-shadow:3px 3px 0 var(--blood),0 0 24px rgba(255,120,40,.9);animation:slam .35s both}
@keyframes slam{0%{transform:scale(4);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
.whiteout{position:fixed;inset:0;z-index:60;background:#fff;opacity:0;pointer-events:none}
.whiteout.on{animation:wo 1s}
@keyframes wo{0%{opacity:1}100%{opacity:0}}
.doka{font-family:var(--display);font-size:56px;color:var(--gold);text-shadow:4px 4px 0 var(--blood),8px 8px 0 var(--sil);transform:rotate(-10deg)}

/* クリア */
.stat{display:grid;grid-template-columns:1fr 3.5em;gap:4px 10px;align-items:center;font-size:13px;font-weight:700}
.stat .t{height:8px;background:#2a1a14;grid-column:1/-1;margin-bottom:6px}
.stat .t i{display:block;height:100%;background:var(--gold)}
.stat b{text-align:right;font-variant-numeric:tabular-nums}
.stat .low{color:var(--blood)}
/* ホワイトボード */
.wb{position:relative;background:#fbfbf8;border:7px solid #aeb4bb;border-bottom-width:13px;box-shadow:inset 0 0 28px rgba(0,0,0,.07),5px 5px 0 var(--sil);padding:22px 4px 2px}
.wb.wb-in{animation:panelIn .45s ease-out both}
.wbt{position:absolute;top:3px;left:8px;font-family:"Yomogi",var(--body);font-size:13px;color:#1d57c9}
.wbsvg{display:block;width:100%;height:auto}
.wbsvg text{font-family:"Yomogi","Zen Kaku Gothic New",sans-serif}
/* オープニング */
#op{position:fixed;inset:0;z-index:45;overflow:hidden}
.op-shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,transparent 30%,rgba(0,0,0,.55) 100%)}
.op-bar{position:absolute;left:0;right:0;height:13%;background:#000;z-index:3}
.op-bar.top{top:0}.op-bar.bot{bottom:0}
.op-hero{position:absolute;bottom:12%;left:-30%;height:36vh;max-height:300px;aspect-ratio:100/160;z-index:2;filter:drop-shadow(0 0 14px rgba(230,130,50,.45))}
.op-hero svg{width:100%;height:100%;display:block;animation:bob .9s ease-in-out infinite}
.op-hero.walk{animation:walk 26s linear forwards}
@keyframes walk{0%{left:-30%}88%{left:calc(50% - 18vh)}100%{left:calc(50% - 18vh)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
.op-village{position:absolute;right:0;bottom:12%;width:min(70%,420px);opacity:0;transition:opacity 2.5s;z-index:1}
.op-village svg{width:100%;display:block}
#op.village .op-village{opacity:1}
.op-cap{position:absolute;left:0;right:0;top:40%;transform:translateY(-50%);z-index:4;text-align:center;background:rgba(0,0,0,.86);border-top:1px solid rgba(239,227,207,.25);border-bottom:1px solid rgba(239,227,207,.25);padding-block:22px;min-height:5.5em;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.op-cap:empty{display:none}
.op-cap p{margin:0 auto;max-width:28em;font-weight:900;font-size:clamp(18px,5vw,26px);letter-spacing:.12em;line-height:1.8;color:#fff;text-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.9);animation:capIn 1.2s ease-out both}
.op-cap p.name{font-family:var(--display);font-size:clamp(46px,15vw,84px);letter-spacing:.3em;color:#fbf6ec;text-shadow:4px 4px 0 var(--blood),8px 8px 0 #000;animation:nameIn .6s cubic-bezier(.2,1.4,.4,1) both}
.op-cap p.year{font-family:var(--display);font-size:clamp(30px,9vw,48px);letter-spacing:.18em}
.op-cap p.say{font-style:normal;color:var(--gold)}
@keyframes capIn{0%{opacity:0;filter:blur(8px);transform:translateY(10px);letter-spacing:.4em}100%{opacity:1;filter:none;transform:none}}
@keyframes nameIn{0%{opacity:0;transform:scale(3)}100%{opacity:1;transform:scale(1)}}
.op-title{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
.op-title .logo{font-size:clamp(46px,14vw,80px)}
#op.titlecard .op-title{opacity:1}
#op.titlecard .op-title .logo{animation:nameIn .7s cubic-bezier(.2,1.4,.4,1) both}
.op-skip{position:absolute;z-index:6;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(13% + 10px);background:transparent;color:#cbbfae;border:1px solid #6b5a4a;font-size:12px;padding:5px 12px}
.dmg{display:none}
.fig.hero.hurt1 .dmg1,.fig.hero.hurt2 .dmg1,.fig.hero.hurt2 .dmg2{display:inline}
.fig.hero.hurt2 .glint{display:none}
.fig.hero.hurt1 svg{filter:sepia(.15)}
.fig.hero.hurt2 svg{transform-origin:50% 100%;animation:pant 1.6s ease-in-out infinite;filter:sepia(.3) brightness(.92)}
@keyframes pant{0%,100%{transform:rotate(-5deg) translateY(4px)}50%{transform:rotate(-3deg) translateY(2px) scaleY(.98)}}
.fig.hero.hurtnow svg{animation:hurtFlash .5s}
@keyframes hurtFlash{0%,100%{filter:none}20%{filter:brightness(2.6) saturate(0)}45%{transform:translateX(-6px)}70%{transform:translateX(4px)}}
/* 話を選ぶ・ランク・クリア記録 */
.rankmini{background:var(--panel);border:2px solid var(--gold);padding:8px 12px;font-family:var(--display);font-size:20px;color:var(--gold);text-shadow:2px 2px 0 var(--sil);display:flex;flex-direction:column;align-items:center;gap:2px}
.rankmini small,.rankname small{font-family:var(--body);font-size:11px;font-weight:700;color:var(--dust);letter-spacing:.2em;text-shadow:none}
.rankmini span{font-family:var(--body);font-size:12px;color:var(--bone);text-shadow:none}
.rankname{font-family:var(--display);font-size:28px;line-height:1.2;color:var(--gold);text-shadow:3px 3px 0 var(--sil);display:flex;flex-direction:column}
.ladder{display:flex;gap:4px}
.ladder i{flex:1;height:10px;background:#2a1a14;border:1px solid var(--dust);transform:skewX(-14deg)}
.ladder i.on{background:linear-gradient(180deg,#f2c766,var(--gold))}
.ladder i.now{box-shadow:0 0 10px rgba(217,164,65,.8)}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rstats div{background:rgba(0,0,0,.35);border:1px solid rgba(201,138,75,.5);padding:6px 4px;text-align:center;display:flex;flex-direction:column;min-width:0}
.rstats span{font-size:10.5px;color:var(--dust);font-weight:700}
.rstats b{font-family:var(--display);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.2}
.rstats b small{font-family:var(--body);font-size:11px;margin-left:1px}
.prog{height:8px;background:#2a1a14;border:1px solid var(--dust)}
.prog i{display:block;height:100%;background:var(--ok)}
.grade{display:flex;align-items:center;gap:12px}
.grade b{font-family:var(--display);font-weight:400;font-size:64px;line-height:1;width:72px;text-align:center;text-shadow:4px 4px 0 var(--sil);animation:gradeIn .6s cubic-bezier(.2,1.4,.4,1) both}
.grade small{font-family:var(--display);font-size:22px;letter-spacing:.1em}
@keyframes gradeIn{0%{transform:scale(2.4) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.gS b,.gS small{color:var(--gold)}.gA b,.gA small{color:var(--bone)}.gB b,.gB small{color:var(--dust)}.gC b,.gC small{color:var(--steel)}
.arc{margin:8px 0 0;font-size:13px;letter-spacing:.2em;color:var(--gold);border-left:5px solid var(--blood);padding-left:8px}
#epList{display:flex;flex-direction:column;gap:8px}
.ep{display:grid;grid-template-columns:4.2em 1fr auto;align-items:center;gap:8px;text-align:left;background:var(--panel);color:var(--bone);border:2px solid rgba(239,227,207,.45);padding:10px 12px;font-size:15px;font-weight:900}
.ep .no{font-family:var(--display);font-weight:400;font-size:13px;color:var(--dust)}
.ep .t{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.ep .t em{font-style:normal;font-size:10px;background:var(--blood);padding:1px 6px;margin-left:6px;vertical-align:2px}
.ep .t small{font-size:11px;font-weight:500;color:var(--dust)}
.ep .st{font-size:11px;color:var(--dust);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ep .st b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
.ep .st.nx{background:var(--blood);color:var(--bone);padding:3px 8px;font-weight:900;letter-spacing:.1em;animation:nxp 1.4s ease-in-out infinite}
@keyframes nxp{50%{box-shadow:0 0 12px rgba(194,45,34,.9)}}
.ep.next{border-color:var(--blood);box-shadow:4px 4px 0 var(--sil)}
.ep.done{border-color:rgba(217,164,65,.6)}
.ep:disabled{opacity:.45;cursor:not-allowed}
.ep:not(:disabled):active{transform:translate(2px,2px)}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.badge{border:1px dashed rgba(201,138,75,.5);padding:6px 8px;display:flex;flex-direction:column;opacity:.5;min-width:0}
.badge b{font-size:13px}.badge small{font-size:10.5px;color:var(--dust);line-height:1.4}
.badge.on{opacity:1;border:2px solid var(--gold);background:rgba(217,164,65,.1)}
.badge.on b{color:var(--gold)}
.badge.new{animation:gradeIn .6s .3s both}
.soon{text-align:center}
.err{border-color:var(--blood)}
.rankup .up{font-family:var(--display);font-size:clamp(40px,12vw,64px);color:var(--gold);text-shadow:4px 4px 0 var(--blood),8px 8px 0 var(--sil);animation:wst .9s cubic-bezier(.2,.8,.3,1) both}
.btn.danger{border-color:var(--steel);color:var(--steel)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- 閉じるボタン（左上） ---------- */
.closebtn{position:fixed;z-index:30;top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));width:30px;height:30px;padding:0;border-radius:50%;background:var(--panel);color:var(--bone);border:1.5px solid var(--dust);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.closebtn:active{transform:scale(.92)}
body.hasclose #s-story .chap,body.hasclose #s-select .chap,body.hasclose #s-clear .chap{padding-left:34px}
body.hasclose #s-battle .hud{padding-left:38px}
/* ---------- 全国ランキング ---------- */
.myrank{display:flex;align-items:baseline;gap:10px}
.myrank small{font-size:11px;color:var(--dust);font-weight:700;letter-spacing:.15em}
.myrank b{font-family:var(--display);font-weight:400;font-size:48px;color:var(--gold);line-height:1;text-shadow:3px 3px 0 var(--sil)}
.myrank b span{font-size:20px;margin-left:2px}
.myrank em{font-style:normal;font-size:13px;color:var(--bone)}
.nickline{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.nickline b{color:var(--gold)}
.kt{display:flex;flex-direction:column}
.kk{display:grid;grid-template-columns:2.2em 1fr 3em 3.2em;gap:6px;align-items:center;padding:7px 2px;border-bottom:1px solid rgba(201,138,75,.35);font-size:13px;font-variant-numeric:tabular-nums}
.kk .kr{font-family:var(--display);font-weight:400;font-size:17px;text-align:center}
.kk:nth-child(2) .kr{color:var(--gold)}.kk:nth-child(3) .kr{color:#c8ccd2}.kk:nth-child(4) .kr{color:#c98a4b}
.kk .kn2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:900}
.kk .kc,.kk .ka{text-align:right}
.kk.kh{font-size:11px;color:var(--dust);padding-top:0}.kk.kh .kr{font-family:var(--body);font-size:11px;color:var(--dust)}
.kk.me{background:rgba(194,45,34,.25);outline:1.5px solid var(--blood)}
b.gold{color:var(--gold)}
.tabs button{font-size:13px;letter-spacing:.04em}
/* ---------- 小道具 ---------- */
.prop{position:absolute;z-index:1;pointer-events:none;height:calc(var(--s,.4) * min(100%,330px));max-width:92%}
.panel.talk .prop{height:calc(var(--s,.4) * min(100% - 118px,330px))}
.prop svg{width:100%;height:100%;display:block}
.prop.bc{left:50%;transform:translateX(-50%);bottom:4%}
.prop.br{right:5%;bottom:-2px}
.prop.bl{left:5%;bottom:-2px}
.prop.mid{left:50%;transform:translateX(-50%);bottom:max(4%,40px);z-index:3}
.prop.hr{right:9%;bottom:24%;z-index:3}
/* ---------- 共有ボタン ---------- */
.share{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.share span{font-size:11.5px;color:var(--dust);font-weight:700;letter-spacing:.1em;width:100%;text-align:center}
.share a{flex:1;min-width:0;max-width:120px;text-align:center;text-decoration:none;font-weight:900;font-size:13px;padding:7px 4px;border:1.5px solid var(--bone);color:var(--bone);background:#0b0807}
.share a.sl{background:#06c755;border-color:#06c755;color:#fff}
.share a:active{transform:translate(1px,1px)}
/* ---------- エルボー・北斗風の決め ---------- */
.elbow{position:absolute;left:0;top:0;z-index:6;width:84px;height:52px;pointer-events:none;transform-origin:20% 50%}
.elbow svg{width:100%;height:100%;display:block}
.finisher.hk{gap:12px}
.fstage{width:100%;overflow:visible!important;height:clamp(200px,40vh,320px)!important}
.fstage .fig.r{height:96%}
.fig.l.rush{transform:translateX(52%);transition:transform .25s}
.hiko{position:absolute;z-index:7;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(circle,#fff 0 25%,#ffd36a 30%,rgba(255,120,40,.0) 70%);box-shadow:0 0 12px #ffb040;animation:hikoA .5s ease-out forwards;pointer-events:none}
@keyframes hikoA{0%{transform:scale(2.2);opacity:1}100%{transform:scale(.6);opacity:.9}}
.fig.r.swell svg:first-child{animation:swellA .7s ease-in forwards}
@keyframes swellA{0%{transform:none}40%{transform:scale(1.08,1.05)}70%{transform:scale(1.18,1.1) skewX(4deg)}100%{transform:scale(1.3,1.2)}}
.shard{position:absolute;z-index:6;pointer-events:none}
.shard svg{width:100%;height:100%;display:block}
.blood{position:absolute;z-index:7;width:12px;height:12px;border-radius:50%;background:#c22d22;pointer-events:none}
.whiteout-mini{position:absolute;inset:-40px;background:#fff;z-index:8;animation:imp .4s forwards;pointer-events:none}
.fline{min-height:4.6em;width:100%;display:flex;align-items:flex-start;justify-content:center}
.fl{background:#fbf6ec;color:#120c0a;border:3px solid #120c0a;border-radius:18px;padding:10px 16px;font-weight:900;font-size:18px;line-height:1.5;max-width:94%;animation:panelIn .3s ease-out both}
.fl b{display:block;font-size:11px;color:var(--blood);letter-spacing:.1em}
.fl.hero{border-color:var(--gold);box-shadow:0 0 0 2px #fbf6ec,0 0 0 4px var(--gold);font-size:20px}
.fl.hero b{color:#8a5a12}
.fl.big{font-family:var(--display);font-weight:400;font-size:clamp(34px,10vw,52px);color:var(--blood);background:none;border:none;text-shadow:3px 3px 0 #000,0 0 18px rgba(255,80,40,.7);transform:rotate(-6deg)}
.fl.big b{display:none}
.ougi-stamp{font-family:var(--display);font-size:clamp(26px,8vw,40px);color:var(--bone);background:var(--blood);border:4px double var(--bone);padding:6px 18px;transform:rotate(-6deg) scale(2.4);opacity:0;text-shadow:2px 2px 0 var(--sil);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.ougi-stamp small{font-size:.45em;letter-spacing:.4em;color:var(--gold)}
.ougi-stamp.on{animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stampIn{0%{opacity:0;transform:rotate(-6deg) scale(2.4)}100%{opacity:1;transform:rotate(-6deg) scale(1)}}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fbf6ec;color:#120c0a;border-color:#120c0a}
.gbtn .g{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;color:#4285f4;font-weight:900;font-family:Arial,sans-serif;border:1px solid #ccc}
.accor{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:12px;color:var(--gold)}
.accor::before,.accor::after{content:"";flex:1;height:1px;background:rgba(239,227,207,.3)}
.accform .minirow{display:flex;gap:8px}.accform .minirow .btn{flex:1}
/* ---------- 逮捕のアニメーション ---------- */
.arrest{position:relative}
.siren{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0}
.siren.on{opacity:1;animation:sirenA .7s steps(1) infinite}
@keyframes sirenA{0%{background:radial-gradient(ellipse at 0% 0%,rgba(230,30,30,.55),transparent 60%)}50%{background:radial-gradient(ellipse at 100% 0%,rgba(40,90,255,.55),transparent 60%)}}
.arrest>*:not(.siren){position:relative;z-index:1}
.fig.acop{transform:translateX(140%);transition:transform .7s cubic-bezier(.2,.9,.3,1)}
.fig.acop.in{transform:none}
.cuffsdrop{position:absolute;z-index:6;left:12%;width:22%;aspect-ratio:120/70;top:-30%;opacity:0;pointer-events:none}
.cuffsdrop svg{width:100%;height:100%;display:block}
.cuffsdrop.on{animation:cuffA .5s cubic-bezier(.5,0,.8,1.4) forwards}
@keyframes cuffA{0%{top:-30%;opacity:1;transform:rotate(-40deg) scale(1.6)}100%{top:62%;opacity:1;transform:rotate(0) scale(1)}}
.taiho{font-family:var(--display);font-size:clamp(60px,20vw,110px);line-height:1;color:var(--blood);text-shadow:4px 4px 0 #000,0 0 26px rgba(255,60,30,.6);transform:scale(2.6) rotate(-8deg);opacity:0}
.taiho.on{animation:stampIn2 .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stampIn2{0%{opacity:0;transform:scale(2.6) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
.tsuzuku{font-weight:900;color:var(--gold);letter-spacing:.2em;font-size:16px;opacity:0;transition:opacity .8s}
.tsuzuku.on{opacity:1}
/* ---------- 表情 ---------- */
.emo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.emo>g{display:none}
.fig.emo-angry .e-angry,.fig.emo-sad .e-sad,.fig.emo-shock .e-shock,.fig.emo-happy .e-happy,.fig.emo-evil .e-evil{display:inline}
.fig.emo-angry .e-angry>g{animation:veinP .5s ease-in-out infinite;transform-origin:70px 21px;transform-box:view-box}
@keyframes veinP{50%{transform:scale(1.25)}}
.fig.emo-angry>svg{animation:emoShake .38s 2}
@keyframes emoShake{0%,100%{transform:none}25%{transform:translateX(-4px) rotate(-2deg)}75%{transform:translateX(4px) rotate(2deg)}}
.fig.emo-sad>svg{transform:translateY(4px) rotate(-2deg);transform-origin:50% 100%;transition:transform .8s}
.fig.emo-sad .e-sad path:first-child{animation:tear 1.6s ease-in infinite}
@keyframes tear{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
.fig.emo-shock>svg{animation:emoJump .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes emoJump{0%{transform:none}40%{transform:translateY(-12px)}100%{transform:none}}

    else{stopSay();k.insertAdjacentHTML('beforeend',wbBox(wbd,false));k.lastElementChild.classList.add('wb-in')}
    i++;$('#komaN').textContent=`${i} / ${total}`;b.textContent=i<panels.length?'次のコマ ▶':(i<total?'関係図を見る ▶':(endLabel||'事件に挑む ▶'));
  };

function panelHTML(p,i){
  const spf=p.say?(p.figs.find(f=>f[1]===p.say.side)||p.figs[0]):null,sp=spf?spf[0]:null;
  const emo=p.say?(p.say.emo||(p.say.evil?'evil':/！/.test(p.say.text)?'angry':/…/.test(p.say.text)?'sad':'')):'';
  const figs=p.figs.map(([t,pos,nm])=>{const e=t===sp?emo:(p.react||'');return `<div class="fig ${pos} ${t}${e?' emo-'+e:''}">${SIL[t]}${EMOSVG}<span class="ntag">${nm||NAMES[t]||''}</span></div>`}).join('');

  return `<div class="kw"><div class="cap">${p.nar}</div><div class="panel ${p.bg?'bg-'+p.bg:''}${p.lines?' lines':''}${p.say?' talk':''}"><div class="tone"></div>${(p.props||[]).map(propHTML).join('')}${figs}${say}<span class="pno">${i+1}</span></div></div>`;
}

function battle(c){show('s-battle');$('#s-battle').classList.remove('bossmode');BGM.play(c.bbgm);S.ehp=100;$('#eName').textContent=c.enemy;$('#stage').innerHTML=stageHTML(c.efig,c.enemy,0,c.efigName);bars();S.queue=['q','ox','ox2'];S.tried={};ask(c,'q')}
const PART={q:50,ox:25,ox2:25};
function ask(c,kind){
  closeSheet();const q=c[kind],isOx=kind!=='q',retry=!!S.tried[kind];S.tried[kind]=1;
  let order=isOx?[0,1]:q.opts.map((_,i)=>i);if(retry&&!isOx)order=order.sort(()=>Math.random()-.5);
  const labels=isOx?['○','×']:q.opts;
  const tag=(retry?'再挑戦 ― ':'')+(kind==='q'?'判断 ― 事件をどう裁く':(kind==='ox'?'追撃 ― 本試験形式 ○×':'とどめ ― 本試験形式 ○×'));
  $('#qcard').innerHTML=`<div class="qhead"><span class="qtag">${tag}</span>${c.wb?'<button class="btn ghost mini" type="button" id="wbBtn">関係図</button>':''}</div><p class="qtext">${q.text}</p><div class="opts${isOx?' ox':''}">${order.map(i=>`<button class="opt" type="button" data-i="${i}">${labels[i]}</button>`).join('')}</div>`;
  wbButton(c.wb);
  const right=isOx?(q.ans?0:1):q.ans;
  $('#qcard').querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
    const i=+btn.dataset.i,ok=i===right;rec(c.topic,ok);
    $('#qcard').querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===right)x.classList.add('right')});
    if(!ok)btn.classList.add('wrong');
    const fb=openSheet(ok?(S.ehp<=PART[kind]?2600:1500):950);
    const verdict=ok?'<div class="verdict ok">命中！</div>':`<div class="verdict ng">見切られた…（残りの命 ${Math.max(0,S.life-1)}）</div>`;
    fb.innerHTML=`${verdict}<span class="law">${q.law}</span><p>${q.exp}</p>${isOx||!c.wb?'':wbBox(c.wb,true)}${ok?'':'<p class="law">この問題は、あとでもう一度出る。</p>'}`;
    S.queue.shift();
    let ko=false;
    if(ok){const dmg=Math.min(S.ehp,PART[kind]);ko=S.ehp-dmg<=0;attack(()=>damage(ko?S.ehp:dmg,ko?'とどめ！':(kind==='q'?c.tech+'！':'追撃！')),randMove())}
    else{hurt();S.queue.push(kind)}
    if(S.life<=0){death(()=>battle(c));return}
    const next=document.createElement('button');next.className='btn';next.type='button';fb.appendChild(next);
    if(!ko){
      next.textContent=ok?'追撃する':'体勢を立て直す';
      next.onclick=()=>{ask(c,S.queue[0]);scrollToCard()};
      if(ok&&kind==='q')setTimeout(()=>kime(c),1500);
    }else{
      setTimeout(()=>{const e=$('#stage .fig.r');e.classList.remove('knock','knockkick','pinned');e.classList.add('ko');BGM.stop();setTimeout(fanfare,500)},1300);
      const nxp=CH.parts[S.part+1];next.textContent=!nxp?'戦いの記録を見る':(nxp.type==='boss'?nxp.enemy+'のもとへ':'次の事件へ');
      next.onclick=()=>nextPart();
      if(kind==='q')setTimeout(()=>kime(c),2600);
    }
    scrollToCard();
  });
}

  const h=$('#stage .fig.l');if(h)setTimeout(()=>h.classList.add('down'),200);

// ボスを、切り絵のようにバラバラにする
function explode(fig,st){
  const r=fig.getBoundingClientRect(),sr=st.getBoundingClientRect(),html=fig.querySelector('svg').outerHTML;fig.style.visibility='hidden';
  const w=document.createElement('div');w.className='whiteout-mini';st.appendChild(w);setTimeout(()=>w.remove(),400);
  punch(2.4);scream(.5,1.2);
  const J=()=>(Math.random()-.5)*14,cut=[0,33,66,100];
  for(let y=0;y<3;y++)for(let x=0;x<3;x++){
    const p=[[cut[x]+(x?J():0),cut[y]+(y?J():0)],[cut[x+1]+(x<2?J():0),cut[y]+(y?J():0)],[cut[x+1]+(x<2?J():0),cut[y+1]+(y<2?J():0)],[cut[x]+(x?J():0),cut[y+1]+(y<2?J():0)]];
    const d=document.createElement('div');d.className='shard';d.style.cssText=`left:${r.left-sr.left}px;top:${r.top-sr.top}px;width:${r.width}px;height:${r.height}px;clip-path:polygon(${p.map(q=>q[0]+'% '+q[1]+'%').join(',')})`;d.innerHTML=html;st.appendChild(d);
    const dx=(x-1)*(60+Math.random()*80)+(Math.random()-.5)*40,dy=-(40+Math.random()*90)+(y-1)*30,rot=(Math.random()-.5)*540;
    d.animate([{transform:'none',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${rot*.6}deg)`,opacity:1,offset:.45},{transform:`translate(${dx*1.4}px,${dy+260}px) rotate(${rot}deg)`,opacity:0}],{duration:reduce?1:1500,easing:'cubic-bezier(.2,.7,.4,1)',fill:'forwards'})}
  for(let i=0;i<14;i++){const b=document.createElement('div');b.className='blood';b.style.left=(r.left-sr.left+r.width*.5)+'px';b.style.top=(r.top-sr.top+r.height*.4)+'px';st.appendChild(b);
    const a=Math.random()*Math.PI*2,dd=60+Math.random()*120;b.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*dd}px),calc(-50% + ${Math.sin(a)*dd}px)) scale(1)`,opacity:0}],{duration:reduce?1:900,easing:'ease-out',fill:'forwards'})}
}

/* ---------- 話データの読み込み（本体と話データを分ける） ---------- */
// 話は episodes/epNNN.js に1話ずつ入っている。目次は episodes/list.js。
const LB={eps:{},episode(e){LB.eps[e.no]=e}};window.LB=LB;
const LIST=(window.LB_LIST||[]).slice().sort((a,b)=>a.no-b.no);
function loadEp(no){
  if(LB.eps[no])return Promise.resolve(LB.eps[no]);
  const m=LIST.find(x=>x.no===no);if(!m)return Promise.reject(new Error('目次にない話'));
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='episodes/'+m.file+'?t='+Date.now();s.onload=()=>LB.eps[no]?res(LB.eps[no]):rej(new Error('話データの形が違う'));s.onerror=()=>rej(new Error('読み込み失敗'));document.head.appendChild(s)});
}

/* ---------- 進み具合の記録（この端末のブラウザに保存） ---------- */
const SAVE_KEY='legalbreak.v2';
function loadP(){let p=null;try{p=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){}return Object.assign({eps:{},streak:0,best:0,ok:0,n:0,clears:0,badges:{}},p||{})}
let P=loadP();
function saveP(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(P))}catch(e){}if(typeof pushCloud==='function')pushCloud()}
const cleared=()=>Object.keys(P.eps).length;
const avgBest=()=>{const v=Object.values(P.eps).map(e=>e.best);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0};
const isOpen=no=>no===LIST[0]?.no||!!P.eps[no-1]||!!P.eps[no];
const nextNo=()=>{const m=LIST.find(x=>!P.eps[x.no]&&isOpen(x.no));return m?m.no:null};

/* ---------- 地位（ランク）と称号 ---------- */
// need=クリアした話の数 avg=平均正答率(各話のベスト) st=正答率80%以上の連続クリア記録
const RANKS=[
 {name:'独学入門者',need:0,avg:0,st:0},
 {name:'独学見習い',need:1,avg:0,st:0},
 {name:'独学戦士',need:2,avg:60,st:0},
 {name:'独学師範代',need:5,avg:70,st:2},
 {name:'独学師範',need:15,avg:75,st:4},
 {name:'独学マスター',need:30,avg:80,st:8},
 {name:'独学王',need:60,avg:85,st:15}];
function rankIdx(){let r=0;for(let i=1;i<RANKS.length;i++){const R=RANKS[i];if(cleared()>=R.need&&avgBest()>=R.avg&&P.best>=R.st)r=i;else break}return r}
function rankNeed(i){const R=RANKS[i];if(!R)return '';const w=[];
  if(cleared()<R.need)w.push(`あと${R.need-cleared()}話クリア`);
  if(avgBest()<R.avg)w.push(`平均正答率${R.avg}%以上`);
  if(P.best<R.st)w.push(`80%以上を${R.st}回連続`);
  return w.join('・')}
const GRADES=[[100,'S','完全制圧'],[80,'A','快勝'],[60,'B','辛勝'],[0,'C','要修行']];

const escH=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ACC={on:false,user:null,db:null,auth:null,timer:null};
const EMAIL_KEY='legalbreak.email';
function mergeP(a,b){
  const o=Object.assign({},a,{eps:Object.assign({},a.eps),badges:Object.assign({},b.badges||{},a.badges)});
  for(const [k,v] of Object.entries(b.eps||{})){const x=o.eps[k];o.eps[k]=x?{best:Math.max(x.best,v.best),clears:Math.max(x.clears,v.clears),last:x.last??v.last}:v}
  ['best','ok','n','clears'].forEach(k=>o[k]=Math.max(a[k]||0,b[k]||0));
  o.streak=(b.clears||0)>(a.clears||0)?(b.streak||0):(a.streak||0);return o;
}
function pushCloud(){if(!ACC.user)return;clearTimeout(ACC.timer);ACC.timer=setTimeout(()=>{ACC.db.collection('progress').doc(ACC.user.uid).set({p:P,updated:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});pushRank()},700)}

    firebase.initializeApp(cfg);ACC.auth=firebase.auth();ACC.auth.languageCode='ja';ACC.db=firebase.firestore();ACC.on=true;
    ACC.auth.onAuthStateChanged(u=>{ACC.user=u;if(u){pullCloud()}else if(!ACC.auth.isSignInWithEmailLink(location.href)){ACC.auth.signInAnonymously().catch(()=>{})}accRender()});

    accRender();

}

function arrestScene(done){
  closeSheet();stopSay();BGM.stop();const A=CH.arrest,ov=$('#ov');ov.hidden=false;ov.className='black';ov.style.cssText='';
  const wait=ms=>new Promise(r=>setTimeout(r,ms)),sayP=(t,k)=>new Promise(r=>say([[t,k]],r));
  ov.innerHTML=`<div class="finisher hk arrest"><div class="siren" id="siren"></div><div class="stage fstage" id="astage"><div class="tone"></div><div class="fig l hero">${SIL.hero}${EMOSVG}<span class="ntag">佐藤</span></div><div class="fig r keiji acop">${SIL.keiji}${EMOSVG}<span class="ntag">${NAMES.keiji}</span></div><div class="cuffsdrop" id="cuffs"><svg viewBox="0 0 120 70">${PROPS.cuffs.svg}</svg></div></div><div class="fline" id="aline"></div><div class="taiho" id="taiho">逮捕</div><div class="tsuzuku" id="tsuzuku">${A.tsuzuku||'次章へ続く'}</div><button class="btn" type="button" id="toRec" hidden>戦いの記録を見る</button></div>`;
  const line=(t,who,cls='')=>{$('#aline').innerHTML=`<div class="fl ${cls}"><b>${who}</b>${t}</div>`};
  const st=$('#astage'),cop=st.querySelector('.acop'),hero=st.querySelector('.fig.l');
  (async()=>{
    await wait(500);
    for(const [t,k,nm] of A.lines){
      if(k==='keiji'&&!cop.classList.contains('in')){
        $('#siren').classList.add('on');const a=ac();if(a&&!S.mute){BGM.play(CH.arrestbgm||'k5arrest');I.siren(a,a.destination,a.currentTime+.05,6,.05)}
        await wait(900);cop.classList.add('in');await wait(700)}
      if(k==='hero')hero.classList.add('emo-angry');
      line(t,nm||NAMES[k]||'',k==='hero'?'hero':'');await Promise.all([sayP(t,k),wait(Math.max(1800,t.length*120))]);
    }
    // 手錠がかかる
    const c=$('#cuffs');c.classList.add('on');await wait(520);
    const a=ac();if(a&&!S.mute){I.clank(a,a.destination,a.currentTime+.01,.5);I.taiko(a,a.destination,a.currentTime+.01,.9)}
    hit(1.6);$('#aline').innerHTML='';
    await wait(500);$('#taiho').classList.add('on');await wait(1300);$('#tsuzuku').classList.add('on');await wait(900);
    const b=$('#toRec');b.hidden=false;b.onclick=()=>{ov.hidden=true;ov.innerHTML='';ov.className='';ov.style.cssText='';done()};
  })();
}

const voiceFor=k=>{const v=VP[k]||VP.narr,arr=(v.g==='f'?TTS.fem:TTS.male)||[];return arr.length?arr[v.i%arr.length]:TTS.any};
const yomi=t=>t.replace(/取消(?!し)/g,'取り消し').replace(/荒野/g,'こうや').replace(/(?<![一-龯々])金(?![一-龯々])/g,'カネ');
const cleanTxt=t=>t.replace(/<br>/g,'').replace(/[「」―]/g,'').replace(/　/g,'');
function fanfare(){const a=ac();if(!a)return;const t=a.currentTime;[[62,0],[66,.18],[69,.36],[74,.54]].forEach(([n,dt])=>I.brass(a,a.destination,n,t+dt,dt===.54?1.2:.16,.09));I.taiko(a,a.destination,t+.54,.7);I.whip(a,a.destination,t+.5,.3)}
const MOBILE=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function stopSay(){SAY.run++;stopVoice();try{TTS.ok&&speechSynthesis.cancel()}catch(e){}duck(false)}
/* 録音済みの声（audio/ フォルダ）。あれば再生し、なければ端末の読み上げを使う */
const VO={map:window.LB_AUDIO||{},buf:new Map(),src:null};
function vHash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)}return (h>>>0).toString(16).padStart(8,'0')}
const vKey=(t,k)=>vHash((VP[k]?k:'narr')+'|'+cleanTxt(t));
// アプリを裏に回したら（ホームに戻る・画面を消す・別のアプリへ）、BGMも声も止める。戻ったら再開
function bgPause(hide){try{if(hide){if(AC&&AC.state==='running')AC.suspend();speechSynthesis.cancel()}else if(AC&&!S.mute&&AC.state!=='running')AC.resume()}catch(e){}}
document.addEventListener('visibilitychange',()=>bgPause(document.hidden));
addEventListener('pagehide',()=>bgPause(true));addEventListener('pageshow',()=>bgPause(document.hidden));
addEventListener('blur',()=>{if(document.hidden)bgPause(true)});
function vLoad(h){if(!VO.buf.has(h))VO.buf.set(h,fetch('audio/'+h+'.mp3').then(r=>{if(!r.ok)throw new Error('no audio');return r.arrayBuffer()}).then(b=>AC.decodeAudioData(b)).catch(e=>{VO.buf.delete(h);throw e}));return VO.buf.get(h)}
function stopVoice(){if(VO.src){try{VO.src.onended=null;VO.src.stop()}catch(e){}VO.src=null}}
function say(list,done){
  if(S.mute||S.noVoice||!list.length){done&&done();return}
  stopVoice();try{TTS.ok&&speechSynthesis.cancel()}catch(e){}
  const a=ac(),run=++SAY.run;let i=0;duck(true);
  const loads=list.map(([t,k])=>{const h=vKey(t,k);return a&&VO.map[h]?vLoad(h):null});
  loads.forEach(p=>p&&p.catch(()=>{}));
  const next=()=>{if(run!==SAY.run)return;if(i>=list.length){duck(false);done&&done();return}
    const idx=i++,[t,k]=list[idx],v=VP[k]||VP.narr;
    let fin=false;const end=()=>{if(fin)return;fin=true;setTimeout(next,220)};
    const tts=()=>{if(!TTS.ok){end();return}
      try{const u=new SpeechSynthesisUtterance(yomi(cleanTxt(t)));u.lang='ja-JP';const vo=voiceFor(k);if(vo)u.voice=vo;const rr=v.r>1?1+(v.r-1)*.25:v.r;if(MOBILE){u.pitch=Math.min(1.5,Math.max(.7,.7+v.p*.4));u.rate=Math.min(1,Math.max(.85,rr))}else{u.pitch=v.p;u.rate=Math.min(1.1,rr)}
        u.onend=end;u.onerror=end;speechSynthesis.speak(u);setTimeout(end,15000)}catch(e){end()}};
    if(loads[idx])loads[idx].then(buf=>{if(run!==SAY.run||fin)return;const src=a.createBufferSource();src.buffer=buf;src.connect(a.destination);src.onended=end;VO.src=src;src.start();setTimeout(end,buf.duration*1000+3000)}).catch(()=>{if(run===SAY.run&&!fin)tts()});
    else tts();
  };
  next();
}
const narrate=(text,done,k)=>say([[text,k||'narr']],done);
function duck(on){if(BGM.bus&&AC){const g=BGM.bus.gain;g.cancelScheduledValues(AC.currentTime);g.setValueAtTime(Math.max(g.value,.0001),AC.currentTime);g.exponentialRampToValueAtTime(on?.18:.55,AC.currentTime+.4)}}

function opening(ep,done){
  OPDONE=done;const run=++OPRUN;const LINES=ep.op,T=ep.opTitle;
  $('#op .op-title').innerHTML=T?`<div class="logo"><span class="pre">${T.pre}</span>${T.main}${T.small?'<small>'+T.small+'</small>':''}</div>`:'<div class="logo"><span class="pre">行政書士独学応援</span>LEGAL BREAK<small>―法の拳―</small></div>';
  try{if(TTS.ok){speechSynthesis.cancel();const w=new SpeechSynthesisUtterance(' ');w.volume=0;speechSynthesis.speak(w)}}catch(e){}
  const op=$('#op');op.hidden=false;op.classList.remove('village','titlecard');$('#opHero').innerHTML=SIL.hero;const cap=$('#opCap');cap.innerHTML='';
  const hero=$('#opHero');hero.classList.remove('walk');void hero.offsetWidth;hero.classList.add('walk');
  BGM.play('opening');

  const step=i=>{
    if(i>=LINES.length){cap.innerHTML='';op.classList.add('titlecard');const a=ac();if(a){I.taiko(a,a.destination,a.currentTime,1);punch(1.6)}wait(3200,opEnd);return}
    const L=LINES[i];cap.innerHTML=`<p class="${L.c||''}">${L.t}</p>`;

    if(L.fx==='village'){op.classList.add('village');const a=ac();if(a){I.bell(a,a.destination,50,a.currentTime,.12,5);I.bell(a,a.destination,50,a.currentTime+1.6,.08,5)}}
    const t0=Date.now();
    wait(L.fx==='taiko'?500:300,()=>narrate(L.v||L.t,()=>{if(run!==OPRUN)return;const left=Math.max(700,L.d-(Date.now()-t0));wait(left,()=>step(i+1))},L.c==='say'?'hero':'narr'));
  };
  wait(900,()=>step(0));
}
