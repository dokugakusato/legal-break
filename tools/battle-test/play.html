<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>ONLINE BATTLE 動作確認（にせサーバー）</title>
<link rel="stylesheet" href="../../battle/battle.css">
</head><body>
<div id="inapp" hidden></div>
<main id="app"></main>
<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheetIn"></div></div>
<!-- 本物の battle/index.html の中身を読み込み、にせサーバーで動かす（ファイルは共通） -->
<script>
  window.module = { exports: {} };
</script>
<script src="../../functions/questions.js"></script>
<script>
  window.LB_Q = module.exports; window.module = { exports: {} };
</script>
<script src="../../functions/kijutsu.js"></script>
<script>
  window.LB_K = module.exports; delete window.module;
</script>
<script src="../../functions/logic.js"></script>
<script src="mock-api.js"></script>
<script>
  // battle/index.html の <main> の中身をそのまま使う
  (function () {
    var x = new XMLHttpRequest(); x.open('GET', '../../battle/index.html', false); x.send();
    var d = new DOMParser().parseFromString(x.responseText, 'text/html');
    document.getElementById('app').innerHTML = d.getElementById('app').innerHTML;
    ['soundBtn', 'toasts', 'cutin'].forEach(function (id) { document.body.appendChild(d.getElementById(id)); });
  })();
  window.LB_BATTLE_FIREBASE = null;
</script>
<script src="../../battle/sato.js"></script>
<script src="../../battle/fighters.js"></script>
<script src="../../battle/music.js"></script>
<script src="../../battle/battle.js"></script>
</body></html>
